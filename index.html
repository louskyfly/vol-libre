  #pmenu{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:56px;background:rgba(6,10,14,.45);backdrop-filter:blur(3px);pointer-events:auto}

  #pmenu .pi:active,#pmenu .pi.sel{background:rgba(120,190,240,.18);border-color:rgba(140,210,255,.45)}

  #ah{position:absolute;left:50%;top:12px;bottom:auto;transform:translateX(-50%);width:124px;height:124px;
    pointer-events:none;opacity:.92;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
  #map{position:absolute;left:14px;top:198px;right:auto;bottom:auto;width:112px;height:112px;pointer-events:none;opacity:.9;
    border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#e8f2fb;
    background:rgba(120,10,10,.35);font-size:18px;letter-spacing:.05em;backdrop-filter:blur(2px)}
  #msg.on{display:grid}
  #msg span{opacity:.7;font-size:13px;display:block;margin-top:8px}
</style>

<script type="module">
import * as THREE from './three.module.js';

/* ------------------------------------------------------------------ */
/*  utilitaires                                                        */
/* ------------------------------------------------------------------ */
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const lerp  = (a, b, t) => a + (b - a) * t;
const D2R   = Math.PI / 180;
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ------------------------------------------------------------------ */
/*  bruit déterministe                                                 */
/* ------------------------------------------------------------------ */
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * noise2(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return s;
}

/* ------------------------------------------------------------------ */
/*  terrain : une île de ~15 km, aéroport à deux pistes reliées        */
/* ------------------------------------------------------------------ */
const RW_Y = 4.2;          // altitude des surfaces bétonnées
const PL_Y = RW_Y - 0.35;  // plaine autour, juste en dessous

// Surfaces dures : pistes, taxiways, aires (rectangles axis-aligned en x/z)
const RUNWAYS = [
  { x: 0, z: 0, w: 36, l: 1400, name: '18/36' },      // piste nord-sud
  { x: 0, z: 80, w: 1000, l: 30, name: '09/27' }      // piste est-ouest croisant la première
];
const TAXIWAYS = [
  { x: -260, z: -520, w: 18, l: 420 },
  { x: -260, z: -310, w: 260, l: 18 },
  { x: 260, z: 520, w: 18, l: 420 },
  { x: 260, z: 310, w: 260, l: 18 },
  { x: 0, z: -310, w: 520, l: 18 },
  { x: 0, z: 310, w: 520, l: 18 }
];
const HARD = [...RUNWAYS, ...TAXIWAYS];

function inRectXZ(x, z, r) { return Math.abs(x - (r.x||0)) < r.w/2 && Math.abs(z - (r.z||0)) < r.l/2; }
function onHardSurface(x, z) { return HARD.some(r => inRectXZ(x, z, r)); }
const onRunway = onHardSurface; // compat

// îlots au large, pour un horizon moins vide
const ISLETS = [
  { x: 6200, z: -4200, r: 1500, h: 120 },
  { x: -6800, z: -2600, r: 1900, h: 170 },
  { x: 2100, z: 7400, r: 1200, h: 90 }
];

function airportMask(x, z) {
  // zone aplatie couvrant les deux pistes et les taxiways
  const d1 = Math.max(Math.abs(x) - 80, Math.abs(z) - 780);
  const d2 = Math.max(Math.abs(x) - 580, Math.abs(z - 80) - 70);
  const d3 = Math.max(Math.abs(x) - 320, Math.abs(z) - 360);
  const d = Math.min(d1, d2, d3);
  return 1 - smoothstep(40, 260, d);
}

function terrainHeight(x, z) {
  const r = Math.hypot(x, z);
  const R = 7800;
  let mask = 1 - smoothstep(R * 0.55, R, r);
  mask = Math.pow(mask, 1.2);
  const mtn = smoothstep(2300, 4600, r);          // relief repoussé loin de la piste

  const n = fbm(x * 0.00007 + 11.3, z * 0.00007 - 4.7, 5);
  const ridge = fbm(x * 0.00021 + 3.1, z * 0.00021 + 8.2, 4);
  let h = (n * 820 + ridge * ridge * 780) * mask * mtn;
  h += 6 * mask - 45 * (1 - mask);

  for (const is of ISLETS) {
    const dd = Math.hypot(x - is.x, z - is.z);
    if (dd < is.r) {
      const f = 1 - dd / is.r;
      h = Math.max(h, -30 + f * f * (is.h + 45));
    }
  }

  const flat = smoothstep(900, 2400, r);
  h = PL_Y + (h - PL_Y) * flat;
  // aplatir l'emprise aéroport
  const ap = airportMask(x, z);
  h = lerp(h, PL_Y, ap);
  return h;
}

function groundAt(x, z) {
  return onHardSurface(x, z) ? RW_Y : terrainHeight(x, z);
}

/* ------------------------------------------------------------------ */
/*  rendu                                                              */
/* ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY_BOT = new THREE.Color(0xcfe0ee);
const SKY_TOP = new THREE.Color(0x3f74ad);
scene.fog = new THREE.FogExp2(0xc9dceb, 0.000038);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 30000);

const SUN_DIR = new THREE.Vector3(-0.42, 0.66, 0.36).normalize();
const MOON_DIR = new THREE.Vector3(0.25, 0.55, -0.35).normalize();
const SKY_BOT_DAY = new THREE.Color(0xcfe0ee), SKY_TOP_DAY = new THREE.Color(0x3f74ad);
const SKY_BOT_NIGHT = new THREE.Color(0x0d2034), SKY_TOP_NIGHT = new THREE.Color(0x020610);
let isNight = false, sunSprite = null, moonSprite = null;

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: { top: { value: SKY_TOP.clone() }, bot: { value: SKY_BOT.clone() }, sunDir: { value: SUN_DIR.clone() }, night: { value: 0 }, time: { value: 0 } },
  vertexShader: `varying vec3 vd; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vd = normalize(wp.xyz); gl_Position = projectionMatrix*viewMatrix*wp; }`,
  fragmentShader: `
    uniform vec3 top; uniform vec3 bot; uniform vec3 sunDir; uniform float night; uniform float time; varying vec3 vd;
    void main(){
      float t = clamp(vd.y * 1.35 + 0.22, 0.0, 1.0);
      vec3 c = mix(bot, top, t);
      vec3 d = normalize(vd);
      float s = max(dot(d, sunDir), 0.0);
      if (night < 0.5) {
        c += vec3(1.0, 0.90, 0.72) * pow(s, 5.0) * 0.26;
        c += vec3(1.0, 0.96, 0.88) * pow(s, 900.0) * 3.2;
      } else {
        // halo lunaire + disque
        c += vec3(0.62,0.74,1.0) * pow(s, 90.0) * 0.30;
        c += vec3(0.95,0.97,1.0) * pow(s, 3000.0) * 2.4;
        // étoiles
        vec3 q = floor(d * 300.0);
        float h = fract(sin(dot(q, vec3(12.9898,78.233,37.719))) * 43758.5453);
        float star = step(0.9955, h) * smoothstep(0.015, 0.22, d.y);
        float tw = 0.65 + 0.35 * sin(time * 2.0 + h * 80.0);
        c += vec3(0.88, 0.94, 1.0) * star * tw * 1.6;
        // lueur d'horizon (ville / lune)
        c += vec3(0.055, 0.10, 0.16) * smoothstep(0.30, 0.0, abs(d.y));
      }
      gl_FragColor = vec4(c, 1.0);
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 32, 16), skyMat);
sky.frustumCulled = false;
sky.renderOrder = -1;
scene.add(sky);

// halo solaire
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,255,245,1)');
  gr.addColorStop(0.08,'rgba(255,250,220,0.95)');
  gr.addColorStop(0.25,'rgba(255,230,170,0.35)');
  gr.addColorStop(1,'rgba(255,220,150,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(cv);
  const sm = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  sunSprite = new THREE.Sprite(sm);
  sunSprite.scale.set(900, 900, 1);
  sunSprite.position.copy(SUN_DIR).multiplyScalar(8500);
  scene.add(sunSprite);

  // lune : disque net + halo
  const mm = new THREE.SpriteMaterial({ map: tex, color: 0xeaf2ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  moonSprite = new THREE.Sprite(mm);
  moonSprite.scale.set(420, 420, 1);
  moonSprite.position.copy(MOON_DIR).multiplyScalar(8600);
  moonSprite.visible = false;
  scene.add(moonSprite);
}

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x4a5a44, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.copy(SUN_DIR).multiplyScalar(1000);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.4;
const S_SH = 90;
sun.shadow.camera.left = -S_SH; sun.shadow.camera.right = S_SH;
sun.shadow.camera.top = S_SH; sun.shadow.camera.bottom = -S_SH;
sun.shadow.camera.near = 200; sun.shadow.camera.far = 1800;
scene.add(sun);
scene.add(sun.target);

function applyDayNight() {
  const n = isNight;
  skyMat.uniforms.night.value = n ? 1 : 0;
  skyMat.uniforms.top.value.copy(n ? SKY_TOP_NIGHT : SKY_TOP_DAY);
  skyMat.uniforms.bot.value.copy(n ? SKY_BOT_NIGHT : SKY_BOT_DAY);
  skyMat.uniforms.sunDir.value.copy(n ? MOON_DIR : SUN_DIR);
  scene.fog.color.set(n ? 0x0a1826 : 0xc9dceb);
  scene.fog.density = n ? 0.000028 : 0.000038;
  hemi.intensity = n ? 0.62 : 1.2;
  hemi.color.set(n ? 0x6c8fc4 : 0xcfe4ff);
  hemi.groundColor.set(n ? 0x0c1726 : 0x4a5a44);
  sun.intensity = n ? 0.6 : 2.4;
  sun.color.set(n ? 0xa8c6ff : 0xfff4e0);
  sun.castShadow = !n;
  if (sunSprite) sunSprite.visible = !n;
  if (moonSprite) moonSprite.visible = n;
  renderer.toneMappingExposure = n ? 1.0 : 1.05;
  if (typeof nightSets !== 'undefined') for (const k in nightSets) nightSets[k].visible = n;
  if (typeof waterMat !== 'undefined') waterMat.uniforms.sunDir.value.copy(n ? MOON_DIR : SUN_DIR);
  if (typeof cloudMats !== 'undefined') {
    for (const m of cloudMats) {
      m.color.set(n ? 0x2a3b52 : 0xffffff);
      m.opacity = n ? m.userData.dayOpacity * 0.35 : m.userData.dayOpacity;
    }
  }
  if (typeof lineMat !== 'undefined') lineMat.color.set(n ? 0x9aa4ac : 0xf0f2ec);
  if (typeof taxiLineMat !== 'undefined') taxiLineMat.color.set(n ? 0x9a7c22 : 0xf0c842);
  updatePlaneNight(n);
  const btn = document.getElementById('bnuit'); if (btn) btn.textContent = n ? 'JOUR' : 'NUIT';
  document.body.classList.toggle('night', n);
}
function updatePlaneNight(n=isNight) {
  if (!aircraft || !aircraft.userData) return;
  const nav = aircraft.userData.nav;
  if (nav) {
    nav.red.visible = n; nav.green.visible = n; nav.white.visible = n;
    nav.beacon.visible = n;
  }
  if (aircraft.userData.beam) aircraft.userData.beam.visible = n;
}
function toggleNight() { isNight = !isNight; applyDayNight(); toast(isNight ? 'Nuit' : 'Jour'); }

// --- mer
const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: { sunDir: { value: SUN_DIR }, time: { value: 0 }, deep: { value: new THREE.Color(0x163a58) }, shallow: { value: new THREE.Color(0x2f7da8) } },
  vertexShader: `
    varying vec3 vW; varying vec3 vN;
    uniform float time;
    void main(){
      vec3 p = position;
      float w = sin(p.x*0.004 + time*0.7)*0.18 + cos(p.z*0.0035 - time*0.6)*0.18;
      w += sin((p.x+p.z)*0.002 + time*0.4)*0.12;
      p.y += w;
      vN = normalize(normalMatrix * vec3(-cos(p.x*0.004+time*0.7)*0.004, 1.0, sin(p.z*0.0035-time*0.6)*0.0035));
      vec4 wp = modelMatrix * vec4(p,1.0); vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform vec3 sunDir; uniform vec3 deep; uniform vec3 shallow; uniform float time;
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      vec3 N = normalize(vN);
      float fres = pow(1.0 - max(dot(N,V), 0.0), 4.0);
      vec3 col = mix(shallow, deep, clamp(fres*0.8 + 0.15, 0.0, 1.0));
      vec3 H = normalize(sunDir + V);
      float spec = pow(max(dot(N,H), 0.0), 220.0);
      col += vec3(1.0,0.97,0.9) * spec * 1.8;
      float shore = smoothstep(-6.0, 2.5, vW.y); // léger bord
      col = mix(vec3(0.55,0.72,0.78), col, clamp(0.55 + fres*0.45, 0.0, 1.0));
      gl_FragColor = vec4(col, 0.96);
    }`
});
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(60000, 60000, 1, 1).rotateX(-Math.PI / 2),
  waterMat
);
water.position.y = -0.15;
water.receiveShadow = true;
scene.add(water);

// --- relief
const T_SIZE = 18000, T_SEG = 256;

function groundTexture() {
  const S = 512, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = '#b9c4a4'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 4200; i++) {
    const x = Math.random() * S, y = Math.random() * S, r = 4 + Math.random() * 16;
    g.fillStyle = Math.random() < 0.5 ? 'rgba(120,140,104,0.5)' : 'rgba(238,242,220,0.4)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(230, 230);
  t.anisotropy = 4;
  return t;
}

const tGeo = new THREE.PlaneGeometry(T_SIZE, T_SIZE, T_SEG, T_SEG).rotateX(-Math.PI / 2);
{
  const p = tGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
  tGeo.computeVertexNormals();

  const nrm = tGeo.attributes.normal;
  const col = new Float32Array(p.count * 3);
  const cSand = new THREE.Color(0xd6c49a), cGrass = new THREE.Color(0x4e7a45);
  const cRock = new THREE.Color(0x7a756c), cSnow = new THREE.Color(0xeef3f7);
  const tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
    const slope = 1 - Math.abs(nrm.getY(i));
    if (y < 0.8)      tmp.copy(cSand);
    else if (y < 4.5) tmp.copy(cSand).lerp(cGrass, smoothstep(0.8, 4.5, y));
    else              tmp.copy(cGrass).lerp(cRock, smoothstep(200, 520, y));
    if (y > 640)     tmp.lerp(cSnow, smoothstep(640, 900, y));
    tmp.lerp(cRock, smoothstep(0.28, 0.62, slope) * 0.85);
    const shade = 0.84 + 0.3 * fbm(x * 0.0016 + 5, z * 0.0016 - 3, 3);
    tmp.multiplyScalar(shade);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  tGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  tGeo.computeBoundingSphere();
}
const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({
  vertexColors: true, flatShading: true, map: groundTexture()
}));
terrain.receiveShadow = true;

function speedHForFx(){ return Math.hypot(vel.x, vel.z); }
function updateGroundFx(dt, spd, onG, hard, gh) {
  groundFxT += dt;
  if (onG && spd > 12 && groundFxT > 0.06) {
    groundFxT = 0;
    const mat = new THREE.SpriteMaterial({ map: groundFx.tex, transparent:true, depthWrite:false, opacity: hard?0.16:0.18, color: hard?0xdddddd:0xd2c090 });
    const s = new THREE.Sprite(mat);

    s.userData = { life:0, max:0.6+Math.random()*0.5, vx:(Math.random()-0.5)*3, vz:(Math.random()-0.5)*3 };
    groundFx.group.add(s);
  }
  const kids = groundFx.group.children;
  for (let i=kids.length-1;i>=0;i--){
    const s=kids[i]; s.userData.life+=dt; const t=s.userData.life/s.userData.max;
    if(t>=1){ groundFx.group.remove(s); s.material.dispose(); continue; }
    s.position.x += s.userData.vx*dt; s.position.z += s.userData.vz*dt; s.position.y += dt*0.5;
    const sc = s.scale.x + dt*1.2; s.scale.set(sc,sc,1);
    s.material.opacity = (1-t)*(hard?0.16:0.18);
  }
}

function updateContrails(dt) {
  const v = vel.length();
  const jet = (PLANES[planeIdx].look.prop === 0); // jets/chasseur
  const emit = !crashed && !onGround && jet && v > 55 && ctrl.thr > 0.35;
  contrailT += dt;
  if (emit && contrailT > 0.045) {
    contrailT = 0;
    _fwd.set(0,0,-1).applyQuaternion(quat);
    _right.set(1,0,0).applyQuaternion(quat);
    _up.set(0,1,0).applyQuaternion(quat);
    const halfL = PLANES[planeIdx].look.len / 2;
    const span = PLANES[planeIdx].look.span;
    const sources = planeIdx === 3 ? [ -span*0.48, span*0.48 ] : [0]; // bouts d'aile chasseur, sinon réacteur
    for (const ox of sources) {
      const p = pos.clone().addScaledVector(_fwd, -(halfL + 0.6)).addScaledVector(_right, ox).addScaledVector(_up, -0.1);
      const m = new THREE.Sprite(contrails.mat.clone());
      m.position.copy(p);
      m.scale.set(1.4,1.4,1);
      m.userData.life = 0; m.userData.max = 2.4 + Math.random()*1.4;
      contrails.group.add(m);
    }
  }
  const kids = contrails.group.children;
  for (let i = kids.length - 1; i >= 0; i--) {
    const s = kids[i];
    s.userData.life += dt;
    const t = s.userData.life / s.userData.max;
    if (t >= 1) { contrails.group.remove(s); s.material.dispose(); continue; }
    const sc = 1.4 + t * 6.5;
    s.scale.set(sc, sc * 0.65, 1);
    s.material.opacity = (1 - t) * 0.26;
    s.position.y += dt * 0.35;
  }
}

/* --- fabrique de formes ------------------------------------------- */
function loftZ(prof, seg) {
  const pos = [], idx = [];
  for (let i = 0; i < prof.length; i++) {
    const [z, r] = prof[i];
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      pos.push(Math.cos(a) * r, Math.sin(a) * r, z);
    }
  }
  for (let i = 0; i < prof.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * (seg + 1) + j, b = a + seg + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeWing(span, chord, taper, sweep, dihedral, thick, mat) {
  const g = new THREE.BoxGeometry(span, thick, chord, 3, 1, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = Math.abs(p.getX(i)) / (span / 2);
    p.setZ(i, p.getZ(i) * (1 - (1 - taper) * t) + sweep * t);
    p.setY(i, p.getY(i) + dihedral * t * t);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function makeFin(h, chord, taper, mat) {
  const g = new THREE.BoxGeometry(0.14, h, chord, 1, 3, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) + h / 2) / h;
    p.setZ(i, p.getZ(i) * (1 - (1 - taper) * t) + chord * 0.55 * t);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function buildPlane(P) {
  const L = P.look, g = new THREE.Group();
  const matBody  = new THREE.MeshStandardMaterial({ color: L.body, roughness: 0.38, metalness: 0.22 });
  const matAcc   = new THREE.MeshStandardMaterial({ color: L.accent, roughness: 0.32, metalness: 0.35 });
  const matDark  = new THREE.MeshStandardMaterial({ color: L.trim, roughness: 0.55, metalness: 0.15 });
  const matGlass = new THREE.MeshPhysicalMaterial({ color: 0x9fd9f5, transparent: true, opacity: 0.32, roughness: 0.05, metalness: 0.0, transmission: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.08 });
  const half = L.len / 2, r = L.rmax;

  // fuselage
  g.add(new THREE.Mesh(loftZ([
    [-half, r * 0.16], [-half * 0.93, r * 0.6], [-half * 0.78, r * 0.88],
    [-half * 0.45, r], [0, r * 0.99], [half * 0.35, r * 0.82],
    [half * 0.7, r * 0.52], [half * 0.92, r * 0.24], [half, r * 0.1]
  ], 12), matBody));

  // ailes
  const addWingAt = (y, zOff=0, spanMul=1) => {
    const w = makeWing(L.span*spanMul, L.chord, L.taper, L.sweep, L.dihedral, L.chord * 0.12, matBody);
    w.position.set(0, y, L.wingZ + zOff);
    g.add(w);
    for (const sx of [-1, 1]) {
      const tip = new THREE.Mesh(new THREE.BoxGeometry(L.span*spanMul * 0.06, L.chord * 0.13, L.chord * (1 - L.taper * 0.55)), matAcc);
      tip.position.set(sx * L.span*spanMul * 0.485, y + L.dihedral * 0.93, L.wingZ + zOff + L.sweep * 0.93);
      g.add(tip);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(L.span*spanMul * 0.22, L.chord * 0.02, L.chord * 0.18), matAcc);
      stripe.position.set(sx * L.span*spanMul * 0.22, y + L.dihedral * 0.18 + L.chord * 0.065, L.wingZ + zOff + L.sweep * 0.22 + L.chord * 0.05);
      g.add(stripe);
    }
  };
  addWingAt(L.wingY);
  if (L.biplane) {
    addWingAt(L.wingY - 0.85, 0.25, 0.95);
    // montants
    for (const sx of [-1, 1]) for (const zz of [-0.1, 0.35]) {
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.9,5), matDark);
      st.position.set(sx*L.span*0.22, L.wingY - 0.42, L.wingZ + zz);
      g.add(st);
    }
  }

  // nez sombre
  const nose = new THREE.Mesh(new THREE.SphereGeometry(r * 0.26, 10, 8), matDark);
  nose.scale.set(1, 1, 1.6);
  nose.position.set(0, r * 0.05, -half + r * 0.05);
  g.add(nose);

  // stabilisateur + dérive
  const stab = makeWing(L.tailSpan, L.tailChord, 0.75, L.sweep * 0.5, 0, L.tailChord * 0.1, matBody);
  stab.position.set(0, L.stabY, L.tailZ);
  g.add(stab);
  const fin = makeFin(L.finH, L.finChord, 0.55, matBody);
  fin.position.set(0, L.finH / 2 + 0.1, L.finZ);
  g.add(fin);
  const finTip = new THREE.Mesh(new THREE.BoxGeometry(0.16, L.finH * 0.16, L.finChord * 0.5), matAcc);
  finTip.position.set(0, L.finH * 0.93 + 0.1, L.finZ + L.finChord * 0.33);
  g.add(finTip);

  // verrière
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), matGlass);
  canopy.scale.set(L.can[0], L.can[1], L.can[2]);
  canopy.position.set(0, L.can[3], L.can[4]);
  g.add(canopy);

  // armement léger décoratif (avion de chasse)
  if (L.nozzle) {
    for (const sx of [-1, 1]) {
      const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, L.span * 0.18, 6), matDark);
      rail.rotation.z = Math.PI / 2;
      rail.position.set(sx * L.span * 0.42, L.wingY - 0.18, L.wingZ + L.sweep * 0.42);
      g.add(rail);
      const tipm = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.7, 8), matAcc);
      tipm.rotation.x = Math.PI / 2;
      tipm.position.set(sx * L.span * 0.48, L.wingY - 0.05, L.wingZ + L.sweep * 0.48 - 0.2);
      g.add(tipm);
    }
  }

  // haubans d'aile (Cessna)
  if (L.strut) {
    for (const sx of [-1, 1]) {
      const h = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, L.span * 0.185, 6), matDark);
      h.position.set(sx * L.span * 0.105, L.wingY - 0.32, L.wingZ + 0.12);
      h.rotation.z = sx * 1.24;
      g.add(h);
    }
  }

  // trains
  if (L.gear) {
    const gearGroup = new THREE.Group();
    for (const sx of [-1, 1]) {
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.5, 6), matDark);
      strut.position.set(sx * L.span * 0.16, -0.45, L.wingZ + 0.25);
      strut.rotation.z = sx * 0.22;
      gearGroup.add(strut);
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.15, 12), matDark);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(sx * L.span * 0.19, -0.78, L.wingZ + 0.25);
      gearGroup.add(wheel);
    }
    const nstrut = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.42, 6), matDark);
    nstrut.position.set(0, -0.5, -half + 0.8);
    gearGroup.add(nstrut);
    const nw = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.13, 10), matDark);
    nw.rotation.z = Math.PI / 2;
    nw.position.set(0, -0.78, -half + 0.8);
    gearGroup.add(nw);
    g.add(gearGroup);
    g.userData.gearGroup = gearGroup;
  }

  // turbulences : hélice ou réacteurs
  if (L.prop) {
    const hub = new THREE.Group();
    for (let i = 0; i < L.prop; i++) {
      const holder = new THREE.Group();
      holder.rotation.z = (i / L.prop) * Math.PI * 2;
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.13, 1.02, 0.045), matDark);
      blade.position.y = 0.5;
      holder.add(blade);
      hub.add(holder);
    }
    hub.position.set(0, 0, -half - 0.06);
    g.add(hub);
    g.userData.prop = hub;
    const spin = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 10), matAcc);
    spin.rotation.x = -Math.PI / 2;
    spin.position.set(0, 0, -half - 0.28);
    g.add(spin);
  }
  if (L.nacelle) {
    for (const sx of [-1, 1]) {
      const nac = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.36, 1.9, 12), matBody);
      nac.rotation.x = Math.PI / 2;
      nac.position.set(sx * L.span * 0.24, L.wingY - 0.42, L.wingZ - 0.9);
      g.add(nac);
      const inl = new THREE.Mesh(new THREE.CircleGeometry(0.33, 12), matDark);
      inl.position.set(sx * L.span * 0.24, L.wingY - 0.42, L.wingZ - 1.86);
      inl.rotation.y = Math.PI;
      g.add(inl);
    }
  }
  if (L.nozzle) {
    const noz = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.36, 1.6, 12, 1, true), matDark);
    noz.rotation.x = Math.PI / 2;
    noz.position.set(0, 0.05, half - 0.55);
    g.add(noz);
    const core = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.9, 10), matAcc);
    core.rotation.x = Math.PI / 2;
    core.position.set(0, 0.05, half - 0.2);
    g.add(core);
    for (const sx of [-1, 1]) {
      const intake = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 2.4), matBody);
      intake.position.set(sx * 0.55, -0.18, -half * 0.15);
      g.add(intake);
    }
    // flamme de postcombustion (intensité liée aux gaz)
    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false });
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.26, 2.2, 10), flameMat);
    flame.rotation.x = -Math.PI / 2;
    flame.position.set(0, 0.05, half + 0.35);
    g.add(flame);
    g.userData.flame = flame;
  }
  // feux de navigation (rouge à gauche, vert à droite, blanc à l'arrière)
  {
    const navRed = new THREE.MeshBasicMaterial({ color: 0xff2a18 });
    const navGreen = new THREE.MeshBasicMaterial({ color: 0x28ff62 });
    const navWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const bulb = new THREE.SphereGeometry(0.15, 6, 6);
    const rl = new THREE.Mesh(bulb, navRed);
    rl.position.set(-L.span * 0.49, L.wingY + L.dihedral * 0.93 + 0.12, L.wingZ + L.sweep * 0.93);
    const grn = new THREE.Mesh(bulb, navGreen);
    grn.position.set(L.span * 0.49, L.wingY + L.dihedral * 0.93 + 0.12, L.wingZ + L.sweep * 0.93);
    const wht = new THREE.Mesh(bulb, navWhite);
    wht.position.set(0, L.finH + 0.15, L.finZ);
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.17, 6, 6), new THREE.MeshBasicMaterial({ color: 0xff3020 }));
    beacon.position.set(0, r + 0.15, L.can[4]);
    g.add(rl, grn, wht, beacon);
    g.userData.nav = { red: rl, green: grn, white: wht, beacon };
    rl.visible = grn.visible = wht.visible = beacon.visible = false;

    // phare d'atterrissage (faisceau additif discret)
    const beamMat = new THREE.MeshBasicMaterial({ color: 0xfff0c4, transparent: true, opacity: 0.055, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const beam = new THREE.Mesh(new THREE.ConeGeometry(3.4, 42, 10, 1, true), beamMat);
    beam.rotation.x = Math.PI / 2;
    beam.position.set(0, -0.2, -half - 21);
    beam.visible = false;
    g.add(beam);
    g.userData.beam = beam;
  }

  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

let planeIdx = 0;

function setPlane(i) {

/* ------------------------------------------------------------------ */
/*  modèle de vol (6 degrés de liberté, coefficients type C172)        */
/* ------------------------------------------------------------------ */
const AC = Object.assign({ g: 9.81 }, PLANES[0].perf);
const GEAR_H = 1.15;
const BELLY_H = 0.55;
const A_STALL = 0.28;                 // ~16 degrés

const pos   = new THREE.Vector3(0, RW_Y + GEAR_H, 560);
const vel   = new THREE.Vector3();
const quat  = new THREE.Quaternion();
const omega = new THREE.Vector3();

const ctrl   = { elev: 0, ail: 0, rud: 0, thr: 0 };
const target = { elev: 0, ail: 0, rud: 0, thr: 0 };

let onGround = true, crashed = false, stallLevel = 0, aoaLive = 0;
let lastGh = 0, simT = 0, throttle = 0;
let gearDown = true, gearAnim = 1; // 1 = sorti, 0 = rentré
const gearExtendable = () => !!PLANES[planeIdx].look.retractable;
const gearEffectiveH = () => gearExtendable() ? lerp(BELLY_H, GEAR_H, gearAnim) : GEAR_H;

const _qI = new THREE.Quaternion(), _vb = new THREE.Vector3(), _vbN = new THREE.Vector3();
const _Fb = new THREE.Vector3(), _Fw = new THREE.Vector3(), _T = new THREE.Vector3();
const _Iw = new THREE.Vector3(), _cr = new THREE.Vector3(), _fwd = new THREE.Vector3();

function reset() {
  const h = gearEffectiveH();
  pos.set(0, RW_Y + GEAR_H, 560);
  vel.set(0, 0, 0);
  quat.identity();
  omega.set(0, 0, 0);
  ctrl.elev = ctrl.ail = ctrl.rud = ctrl.thr = 0;
  target.elev = target.ail = target.rud = target.thr = 0;
  throttle = 0;
  crashed = false;
  gearDown = true; gearAnim = 1;
  AC.Cm0 = PLANES[planeIdx].perf.Cm0;
  pos.y = RW_Y + h;
  lastGh = groundAt(pos.x, pos.z);
  if (typeof resetContrails === 'function') resetContrails();
  if (typeof resetGroundFx === 'function') resetGroundFx();
  document.getElementById('msg').classList.remove('on');
}

function crash() {
  if (crashed) return;
  crashed = true;
  document.getElementById('msg').classList.add('on');
}

function step(dt) {
  simT += dt;

  const k = 1 - Math.exp(-dt * 9);
  ctrl.elev = lerp(ctrl.elev, target.elev, k);
  ctrl.ail  = lerp(ctrl.ail,  target.ail,  k);
  ctrl.rud  = lerp(ctrl.rud,  target.rud,  k);
  ctrl.thr  = lerp(ctrl.thr,  target.thr,  k);

  const rho = 1.225 * Math.exp(-Math.max(pos.y, 0) / 8500);
  _qI.copy(quat).invert();
  _vb.copy(vel).applyQuaternion(_qI);

  const u  = -_vb.z;
  const vs =  _vb.x;
  const wd = -_vb.y;
  const V  = Math.max(Math.sqrt(_vb.lengthSq()), 0.05);
  const alpha = V > 2 ? Math.atan2(wd, u) : 0;
  const beta  = V > 2 ? Math.atan2(vs, Math.hypot(u, wd) + 0.001) : 0;
  aoaLive = alpha;

  const aAbs = Math.abs(alpha), sg = alpha < 0 ? -1 : 1;
  let CL;
  if (aAbs < A_STALL) CL = AC.CL0 + AC.CLa * alpha;
  else {
    const peak = AC.CL0 + AC.CLa * A_STALL * sg;
    CL = peak * Math.max(0.5, 1 - (aAbs - A_STALL) * 1.8);
  }
  const stall = clamp((aAbs - A_STALL) / 0.22, 0, 1);
  stallLevel = stall;

  // auto-centrage (trim) : seulement en vol stabilisé, manche au neutre
  // désactivé en manœuvre (traction, forte assiette, rotation) pour permettre les loopings
  if (!onGround && Math.abs(ctrl.elev) < 0.07 && Math.abs(ctrl.ail) < 0.15 && !crashed) {
    const pitchAbs = Math.abs(Math.asin(clamp(_fwd.set(0, 0, -1).applyQuaternion(quat).y, -1, 1)));
    const qRate = Math.abs(omega.x);
    if (pitchAbs < 0.45 && qRate < 0.55) {
      const want = clamp(alpha, -0.03, 0.19);
      const cible = -AC.Cm_a * want;
      AC.Cm0 += (cible - AC.Cm0) * (1 - Math.exp(-dt * 0.45));
    }
  }

  const CD = AC.CD0 + AC.k * CL * CL + 0.85 * stall * Math.abs(Math.sin(alpha));

  const qbar = 0.5 * rho * V * V;
  const lift = qbar * AC.S * CL;
  const drag = qbar * AC.S * CD;
  const side = qbar * AC.S * AC.CY_b * beta;

  // poussée conservée en montée (favorise les figures), chute progressive à très haute vitesse
  const thrAvail = AC.Tmax * (1 - 0.35 * Math.pow(clamp(V / AC.Vmax, 0, 1.4), 2)) * Math.exp(-Math.max(pos.y, 0) / 12000);
  const T = Math.max(0, thrAvail) * ctrl.thr;

  _Fb.set(0, lift, 0);
  _vbN.copy(_vb).normalize();
  _Fb.addScaledVector(_vbN, -drag);
  _Fb.x += side;
  _Fb.z -= T;

  _Fw.copy(_Fb).applyQuaternion(quat);
  _Fw.y -= AC.m * AC.g;

  // --- moments
  const p = -omega.z, q = omega.x, r = -omega.y;
  const nV = 2 * Math.max(V, 1);
  const pitchNow = Math.asin(clamp(_fwd.set(0, 0, -1).applyQuaternion(quat).y, -1, 1));
  // un peu plus d'autorité en profondeur aux commandes franches (aérobatie), sans nuire au vol stabilisé
  const elevEff = ctrl.elev * (1 + 0.35 * Math.abs(ctrl.elev));
  let M = qbar * AC.S * AC.c * (AC.Cm0 + AC.Cm_a * alpha + AC.Cm_de * elevEff + AC.Cm_q * (q * AC.c / nV));
  if (onGround && pitchNow < 0.05) {
    // appui du train avant : moment constant tant que la roue touche
    if (pitchNow > -0.005) M -= AC.nwLoad;
    else M += -pitchNow * 400000 - omega.x * 20000;
  }
  const L = qbar * AC.S * AC.b * (AC.Cl_b * beta + AC.Cl_p * (p * AC.b / nV) + AC.Cl_da * ctrl.ail + AC.Cl_r * (r * AC.b / nV));
  let N = qbar * AC.S * AC.b * (AC.Cn_b * beta + AC.Cn_r * (r * AC.b / nV) + AC.Cn_da * ctrl.ail);

  const rudCmd = clamp(ctrl.rud + clamp(beta * 3.5, -0.5, 0.5) + clamp(p * 0.04, -0.2, 0.2), -1, 1);
  N += qbar * AC.S * AC.b * AC.Cn_dr * rudCmd;

  _T.set(M, -N, -L);
  if (stall > 0.05) {
    // chute d'aile : dépend du glissement, avec une légère instabilité
    const wd = clamp(beta * 8, -1, 1) + 0.22 * Math.sin(simT * 2.3);
    _T.z += -stall * 1300 * wd;
  }

  _Iw.set(AC.Ix * omega.x, AC.Iy * omega.y, AC.Iz * omega.z);
  _cr.copy(omega).cross(_Iw);
  omega.x += (_T.x - _cr.x) / AC.Ix * dt;
  omega.y += (_T.y - _cr.y) / AC.Iy * dt;
  omega.z += (_T.z - _cr.z) / AC.Iz * dt;
  omega.multiplyScalar(1 - dt * 0.4);

  const dq = new THREE.Quaternion(omega.x * dt * 0.5, omega.y * dt * 0.5, omega.z * dt * 0.5, 1);
  quat.multiply(dq).normalize();

  // --- translation
  vel.addScaledVector(_Fw, dt / AC.m);
  pos.addScaledVector(vel, dt);

  // animation train
  if (gearExtendable()) {
    const targetG = gearDown ? 1 : 0;
    gearAnim = clamp(gearAnim + (targetG - gearAnim) * (1 - Math.exp(-dt * 3.2)), 0, 1);
    if (aircraft.userData.gearGroup) {
      const gg = aircraft.userData.gearGroup;
      gg.position.y = -0.55 * (1 - gearAnim);
      gg.scale.y = 0.15 + 0.85 * gearAnim;
    }
  } else { gearDown = true; gearAnim = 1; }

  // --- sol
  const gh = groundAt(pos.x, pos.z);
  const wasAir = !onGround;
  const effH = gearEffectiveH();
  onGround = false;
  if (gh > lastGh + 0.35 && Math.hypot(vel.x, vel.z) > 10) crash();   // relief qui monte trop vite
  lastGh = gh;
  if (pos.y < gh + effH) {
    const impact = vel.y;
    const speedH = Math.hypot(vel.x, vel.z);
    const belly = gearAnim < 0.3;
    if (impact < -3.5 || (wasAir && !onRunway(pos.x, pos.z) && speedH > 12 && impact < -1.2)) crash();
    if (belly && wasAir && speedH > 8) crash(); // atterrissage train rentré
    pos.y = gh + effH;
    vel.y = 0;
    onGround = true;
    if (wasAir && typeof spawnGroundBurst === 'function') spawnGroundBurst(speedH, impact);
    const sp = Math.hypot(vel.x, vel.z);
    const decel = (ctrl.thr > 0.05 ? 0.18 : 1.1) * dt;
    if (sp > 1e-4) { const f = Math.max(0, sp - decel) / sp; vel.x *= f; vel.z *= f; }
    omega.x *= Math.exp(-dt * 2.5);
    omega.z *= Math.exp(-dt * 7);
    omega.y *= Math.exp(-dt * 1.5);
    if (pitchNow > 0.24 && omega.x > 0) omega.x = 0;
    omega.y -= rudCmd * dt * 2.2 * clamp(1 - speedH / 30, 0, 1);
    if (speedH < 4) {
      const fwd = _fwd.set(0, 0, -1).applyQuaternion(quat);
      const yaw = Math.atan2(-fwd.x, -fwd.z);
      const lvl = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
      quat.slerp(lvl, 1 - Math.exp(-dt * 4));
      omega.set(0, 0, 0);
    }
  }
  if (typeof updateGroundFx === 'function') updateGroundFx(dt, speedHForFx(), onGround, onHardSurface(pos.x,pos.z), gh);
  if (pos.y < 0.6) crash();   // amerrissage

  aircraft.position.copy(pos);
  aircraft.quaternion.copy(quat);
  if (aircraft.userData.prop) aircraft.userData.prop.rotation.z += dt * (8 + ctrl.thr * 120);
  if (aircraft.userData.flame) {
    const f = aircraft.userData.flame;
    const pwr = clamp(ctrl.thr * (1 - clamp((vel.length() - 40) / 120, 0, 0.4)), 0, 1);
    f.visible = pwr > 0.02;
    f.scale.set(1, 0.25 + pwr * 1.6, 1);
    f.material.opacity = 0.18 + pwr * 0.55;
    f.position.z = (PLANES[planeIdx].look.len / 2) + 0.1 + pwr * 0.9;
  }
}

const ctlCanvas = document.getElementById('ctl');
const ctl2d = ctlCanvas.getContext('2d');
function sizeCtl() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  ctlCanvas.width = innerWidth * d; ctlCanvas.height = innerHeight * d;
  ctlCanvas.style.width = innerWidth + 'px'; ctlCanvas.style.height = innerHeight + 'px';
  ctl2d.setTransform(d, 0, 0, d, 0, 0);
}

const stick = { on: false, id: null, dx: 0, dy: 0, R: 108, gx: 0, gy: 0 };
const thrTouch = { on: false, id: null };
const rudTouch = { on: false, id: null, dir: 0 };
const keys = new Set();

function stickBase() {
  return { x: Math.max(155, Math.min(210, innerWidth * 0.18)), y: innerHeight - 165 };
}

function layout() {
  const W = innerWidth, H = innerHeight;
  return {
    W, H,
    thr: { x0: W - 132, y0: Math.max(150, H * 0.26), x1: W - 14, y1: H - 200 },
    rudL: { x0: W - 306, y0: H - 148, x1: W - 196, y1: H - 46 },
    rudR: { x0: W - 186, y0: H - 148, x1: W - 76, y1: H - 46 }
  };
}
const inRect = (x, y, r) => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1;

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (crashed) { reset(); return; }
  const L = layout(), x = e.clientX, y = e.clientY;
  if (inRect(x, y, L.rudL)) { rudTouch.on = true; rudTouch.id = e.pointerId; rudTouch.dir = -1; }
  else if (inRect(x, y, L.rudR)) { rudTouch.on = true; rudTouch.id = e.pointerId; rudTouch.dir = 1; }
  else if (x > L.thr.x0 - 40 && y > L.thr.y0 - 50) { thrTouch.on = true; thrTouch.id = e.pointerId; setThrFromY(y, L); }
  else if (x < L.W * 0.6) {
    // saisie du manche : on garde le décalage pour éviter tout saut
    const b = stickBase();
    stick.on = true; stick.id = e.pointerId;
    stick.gx = (b.x + stick.dx * stick.R) - x;
    stick.gy = (b.y + stick.dy * stick.R) - y;
    document.getElementById('hint').classList.add('off');
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const L = layout(), x = e.clientX, y = e.clientY;
  if (stick.on && e.pointerId === stick.id) {
    const b = stickBase();
    stick.dx = clamp((x + stick.gx - b.x) / stick.R, -1, 1);
    stick.dy = clamp((y + stick.gy - b.y) / stick.R, -1, 1);
  } else if (thrTouch.on && e.pointerId === thrTouch.id) {
    setThrFromY(y, L);
  }
});
function endPointer(e) {
  if (e.pointerId === stick.id) { stick.on = false; stick.id = null; stick.dx = 0; stick.dy = 0; }
  if (e.pointerId === thrTouch.id) { thrTouch.on = false; thrTouch.id = null; }
  if (e.pointerId === rudTouch.id) { rudTouch.on = false; rudTouch.id = null; rudTouch.dir = 0; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);

// sécurité : ne jamais laisser une commande bloquée si le doigt disparaît
function releaseAll() {
  stick.on = false; stick.id = null; stick.dx = 0; stick.dy = 0;
  rudTouch.on = false; rudTouch.dir = 0; rudTouch.id = null;
  thrTouch.on = false; thrTouch.id = null;
}
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
function setThrFromY(y, L) {
  throttle = clamp((L.thr.y1 - y) / (L.thr.y1 - L.thr.y0), 0, 1);
  document.getElementById('hint').classList.add('off');
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  initAudio();
  keys.add(e.code);
  if (e.code === 'KeyR') reset();
  if (e.code === 'KeyC') cycleCam();
  if (e.code === 'KeyG') toggleGear();
  if (e.code === 'KeyN') toggleNight();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));
const K = c => keys.has(c) ? 1 : 0;

function keyboard() {
  let e = 0, a = 0, r = 0, t = null;
  if (K('ArrowDown') || K('KeyS')) e -= 1;    // pousser = nez bas
  if (K('ArrowUp')   || K('KeyW')) e += 1;
  if (K('ArrowRight')|| K('KeyD')) a += 1;
  if (K('ArrowLeft') || K('KeyA')) a -= 1;
  if (K('KeyE')) r += 1;
  if (K('KeyQ')) r -= 1;
  if (K('ShiftLeft') || K('ShiftRight')) t = 1;
  if (K('ControlLeft')) t = 0;
  return { e, a, r, t };
}

const _up = new THREE.Vector3(), _right = new THREE.Vector3();
function updateCamera(dt) {
  _fwd.set(0, 0, -1).applyQuaternion(quat);
  _up.set(0, 1, 0).applyQuaternion(quat);
  _right.set(1, 0, 0).applyQuaternion(quat);

  if (camMode === 1) {
    camera.position.copy(pos).addScaledVector(_fwd, 0.7).addScaledVector(_up, 0.85).addScaledVector(_right, -0.35);
    camera.lookAt(pos.clone().addScaledVector(_fwd, 60).addScaledVector(_up, 0.6));
    aircraft.visible = false;
  } else {
    aircraft.visible = true;
    const yaw = Math.atan2(-_fwd.x, -_fwd.z);
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
    const off = camMode === 0 ? new THREE.Vector3(0, 4.4, 16) : new THREE.Vector3(7, 2.2, 3);
    const want = pos.clone().add(off.applyQuaternion(q));
    camPos.lerp(want, 1 - Math.exp(-dt * 6));
    camera.position.copy(camPos);
    camera.lookAt(pos.clone().addScaledVector(_fwd, 12).addScaledVector(_up, 1.2));
  }
}

/* ---- horizon artificiel ---- */
const ahCv = el('ah'), ah2d = ahCv.getContext('2d');
const mapCvEl = el('map'), map2d = mapCvEl.getContext('2d');
const MAP_N = 96;
const mapTiles = document.createElement('canvas');
mapTiles.width = mapTiles.height = MAP_N;
let mapReady = false;

function buildMap() {
  const g = mapTiles.getContext('2d');
  const img = g.createImageData(MAP_N, MAP_N);
  const D = mapTiles;
  for (let j = 0; j < MAP_N; j++) {
    for (let i = 0; i < MAP_N; i++) {
      const x = (i / (MAP_N - 1) - 0.5) * T_SIZE;
      const z = (j / (MAP_N - 1) - 0.5) * T_SIZE;
      const h = terrainHeight(x, z);
      let r, gg, b;
      if (h < 0)        { r = 24; gg = 62; b = 96; }
      else if (h < 25)  { r = 156; gg = 172; b = 116; }
      else if (h < 260) { r = 72; gg = 112; b = 64; }
      else              { r = 134; gg = 130; b = 120; }
      const k = (j * MAP_N + i) * 4;
      img.data[k] = r; img.data[k + 1] = gg; img.data[k + 2] = b; img.data[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  mapReady = true;
}

function drawAH() {
  const S = 150, C = S / 2, R = 60, c = ah2d;
  c.clearRect(0, 0, S, S);
  _fwd.set(0, 0, -1).applyQuaternion(quat);
  _up.set(0, 1, 0).applyQuaternion(quat);
  _right.set(1, 0, 0).applyQuaternion(quat);
  const pitch = Math.asin(clamp(_fwd.y, -1, 1));
  const bank = Math.atan2(-_right.y, _up.y);

  c.save();
  c.beginPath(); c.arc(C, C, R, 0, 6.2832); c.clip();
  c.translate(C, C);
  c.rotate(-bank);
  c.translate(0, clamp(pitch / 0.55, -1.4, 1.4) * R);
  c.fillStyle = '#2f74b0'; c.fillRect(-R * 2, -R * 4, R * 4, R * 4);
  c.fillStyle = '#6b5a3e'; c.fillRect(-R * 2, 0, R * 4, R * 4);
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-R * 2, 0); c.lineTo(R * 2, 0); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.40)'; c.lineWidth = 1.5;
  for (let d = -30; d <= 30; d += 10) {
    if (!d) continue;
    const yy = -(d / 31.5) * R;
    c.beginPath(); c.moveTo(-13, yy); c.lineTo(13, yy); c.stroke();
  }
  c.restore();

  c.strokeStyle = 'rgba(200,225,245,.5)'; c.lineWidth = 2;
  c.beginPath(); c.arc(C, C, R, 0, 6.2832); c.stroke();
  c.strokeStyle = '#ffd24a'; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(C - 24, C); c.lineTo(C - 9, C); c.lineTo(C - 5, C + 7);
  c.moveTo(C + 24, C); c.lineTo(C + 9, C); c.lineTo(C + 5, C + 7);
  c.stroke();
  c.fillStyle = '#ffd24a';
  c.beginPath(); c.arc(C, C, 2.6, 0, 6.2832); c.fill();
}

function drawMap() {
  const S = 150, c = map2d;
  c.clearRect(0, 0, S, S);
  if (!mapReady) return;
  c.save();
  c.beginPath(); c.arc(S / 2, S / 2, S / 2 - 2, 0, 6.2832); c.clip();
  c.drawImage(mapTiles, 0, 0, S, S);
  const px = (pos.x / T_SIZE + 0.5) * S;
  const py = (pos.z / T_SIZE + 0.5) * S;
  c.save();
  c.translate(px, py);
  c.rotate(Math.atan2(_fwd.x, -_fwd.z));
  c.beginPath(); c.moveTo(0, -8); c.lineTo(5.5, 7); c.lineTo(0, 3.5); c.lineTo(-5.5, 7); c.closePath();
  c.fillStyle = '#ffcc44'; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 1; c.stroke();
  c.restore();
  c.restore();
  c.strokeStyle = 'rgba(200,225,245,.35)'; c.lineWidth = 2;
  c.beginPath(); c.arc(S / 2, S / 2, S / 2 - 2, 0, 6.2832); c.stroke();
  c.fillStyle = 'rgba(230,242,252,.85)'; c.font = 'bold 11px ui-monospace,monospace';
  c.textAlign = 'center'; c.textBaseline = 'top';
  c.fillText('N', S / 2, 5);
}

/* ---- son : moteur + vent (démarre au premier contact) ---- */
let audio = null, muted = false;
function initAudio() {
  if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    const ctx = new Ctx();
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 31;
    const eg = ctx.createGain(); eg.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.7;
    o1.connect(eg); o2.connect(eg); eg.connect(lp); lp.connect(master);
    const len = Math.floor(ctx.sampleRate * 2);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 600; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0;
    noise.connect(nf); nf.connect(ng); ng.connect(master);
    o1.start(); o2.start(); noise.start();
    audio = { ctx, master, o1, o2, eg, lp, ng, nf };
    ctx.resume();
  } catch (e) { audio = null; }
}
function updateAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime, thr = ctrl.thr, v = vel.length();
  const rpm = 0.22 + 0.78 * thr;
  audio.o1.frequency.setTargetAtTime(46 + 78 * rpm, t, 0.08);
  audio.o2.frequency.setTargetAtTime(23 + 39 * rpm, t, 0.08);
  audio.eg.gain.setTargetAtTime(0.05 + 0.13 * thr, t, 0.12);
  audio.lp.frequency.setTargetAtTime(420 + 1900 * thr, t, 0.12);
  audio.ng.gain.setTargetAtTime(0.015 + Math.min(v / 70, 1) * 0.10, t, 0.18);
  audio.nf.frequency.setTargetAtTime(380 + v * 14, t, 0.18);
  audio.master.gain.setTargetAtTime(muted ? 0 : 0.55, t, 0.12);
}
el('bson').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  if (!muted) initAudio();
  el('bson').textContent = muted ? 'MUET' : 'SON';
  el('bson').style.opacity = muted ? '.55' : '1';
});

function roundRect(x, y, w, h, r) {
  ctl2d.beginPath();
  ctl2d.moveTo(x + r, y);
  ctl2d.arcTo(x + w, y, x + w, y + h, r);
  ctl2d.arcTo(x + w, y + h, x, y + h, r);
  ctl2d.arcTo(x, y + h, x, y, r);
  ctl2d.arcTo(x, y, x + w, y, r);
  ctl2d.closePath();
}

function drawControls() {
  const L = layout(), W = L.W, H = L.H;
  ctl2d.clearRect(0, 0, W, H);
  ctl2d.textAlign = 'center';
  ctl2d.textBaseline = 'middle';

  /* ---- manche : toujours visible, base fixe, poignée à ressort ---- */
  const b = stickBase(), R = stick.R;
  ctl2d.beginPath(); ctl2d.arc(b.x, b.y, R + 20, 0, 6.2832);
  ctl2d.fillStyle = 'rgba(8,15,22,.36)'; ctl2d.fill();

  ctl2d.beginPath(); ctl2d.arc(b.x, b.y, R, 0, 6.2832);
  ctl2d.strokeStyle = 'rgba(170,205,235,.34)'; ctl2d.lineWidth = 2; ctl2d.stroke();

  ctl2d.beginPath();
  ctl2d.moveTo(b.x - R, b.y); ctl2d.lineTo(b.x + R, b.y);
  ctl2d.moveTo(b.x, b.y - R); ctl2d.lineTo(b.x, b.y + R);
  ctl2d.strokeStyle = 'rgba(170,205,235,.13)'; ctl2d.lineWidth = 1.5; ctl2d.stroke();

  const kx = b.x + stick.dx * R, ky = b.y + stick.dy * R;
  ctl2d.beginPath(); ctl2d.moveTo(b.x, b.y); ctl2d.lineTo(kx, ky);
  ctl2d.strokeStyle = 'rgba(150,200,235,.55)'; ctl2d.lineWidth = 7; ctl2d.stroke();

  const gr = ctl2d.createRadialGradient(kx - 9, ky - 11, 4, kx, ky, 34);
  gr.addColorStop(0, '#e8f6ff'); gr.addColorStop(0.55, '#7cc4ea'); gr.addColorStop(1, '#2f6f96');
  ctl2d.beginPath(); ctl2d.arc(kx, ky, 31, 0, 6.2832);
  ctl2d.fillStyle = gr; ctl2d.fill();
  ctl2d.strokeStyle = stick.on ? '#ffffff' : 'rgba(255,255,255,.55)';
  ctl2d.lineWidth = 2.5; ctl2d.stroke();

  ctl2d.fillStyle = 'rgba(210,232,248,.5)';
  ctl2d.font = '10px ui-monospace,monospace';
  ctl2d.fillText('MANCHE', b.x, b.y + R + 38);

  /* ---- manette des gaz ---- */
  const tx = (L.thr.x0 + L.thr.x1) / 2, ty0 = L.thr.y0, ty1 = L.thr.y1;
  ctl2d.fillStyle = 'rgba(8,15,22,.36)';
  roundRect(L.thr.x0, ty0 - 34, L.thr.x1 - L.thr.x0, (ty1 - ty0) + 68, 18); ctl2d.fill();

  ctl2d.fillStyle = 'rgba(255,255,255,.13)';
  roundRect(tx - 8, ty0, 16, ty1 - ty0, 8); ctl2d.fill();

  const ky2 = lerp(ty1, ty0, throttle);
  ctl2d.fillStyle = 'rgba(111,208,255,.30)';
  roundRect(tx - 8, ky2, 16, ty1 - ky2, 8); ctl2d.fill();

  const gg = ctl2d.createLinearGradient(tx - 27, 0, tx + 27, 0);
  gg.addColorStop(0, '#2f6f96'); gg.addColorStop(0.5, '#9bdcff'); gg.addColorStop(1, '#2f6f96');
  roundRect(tx - 27, ky2 - 17, 54, 34, 10);
  ctl2d.fillStyle = gg; ctl2d.fill();
  ctl2d.strokeStyle = thrTouch.on ? '#ffffff' : 'rgba(255,255,255,.5)';
  ctl2d.lineWidth = 2; ctl2d.stroke();

  ctl2d.fillStyle = 'rgba(220,238,250,.85)';
  ctl2d.font = 'bold 12px ui-monospace,monospace';
  ctl2d.fillText(Math.round(throttle * 100) + '%', tx, ty0 - 18);
  ctl2d.fillStyle = 'rgba(210,232,248,.45)';
  ctl2d.font = '10px ui-monospace,monospace';
  ctl2d.fillText('GAZ', tx, ty1 + 20);

  /* ---- palonniers ---- */
  for (const [r, lab, dir] of [[L.rudL, '<', -1], [L.rudR, '>', 1]]) {
    const act = rudTouch.on && rudTouch.dir === dir;
    const pg = ctl2d.createLinearGradient(0, r.y0, 0, r.y1);
    pg.addColorStop(0, act ? 'rgba(140,220,255,.55)' : 'rgba(40,62,80,.62)');
    pg.addColorStop(1, act ? 'rgba(90,170,215,.45)' : 'rgba(16,26,36,.62)');
    roundRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0, 16);
    ctl2d.fillStyle = pg; ctl2d.fill();
    ctl2d.strokeStyle = act ? '#8ed8ff' : 'rgba(160,195,225,.28)';
    ctl2d.lineWidth = 2; ctl2d.stroke();
    ctl2d.fillStyle = act ? '#ffffff' : 'rgba(215,235,250,.75)';
    ctl2d.font = '24px ui-monospace,monospace';
    ctl2d.fillText(lab, (r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2 + 1);
  }

  /* ---- vue cockpit : montants de verrière ---- */
  if (camMode === 1) {
    const cx = W/2, cy = H*0.42;
    ctl2d.save();
    ctl2d.strokeStyle = 'rgba(20,28,36,0.55)';
    ctl2d.lineWidth = 10;
    ctl2d.beginPath(); ctl2d.moveTo(cx, -20); ctl2d.lineTo(cx, cy-40); ctl2d.stroke();
    ctl2d.beginPath(); ctl2d.moveTo(-40, H*0.78); ctl2d.lineTo(cx, cy-40); ctl2d.lineTo(W+40, H*0.78); ctl2d.stroke();
    ctl2d.beginPath(); ctl2d.moveTo(W*0.18, H); ctl2d.lineTo(cx, cy-40); ctl2d.lineTo(W*0.82, H); ctl2d.stroke();
    ctl2d.strokeStyle = 'rgba(120,170,210,0.18)'; ctl2d.lineWidth = 2;
    ctl2d.beginPath(); ctl2d.moveTo(cx, -20); ctl2d.lineTo(cx, cy-40); ctl2d.lineTo(-40, H*0.78); ctl2d.stroke();
    ctl2d.beginPath(); ctl2d.moveTo(cx, cy-40); ctl2d.lineTo(W+40, H*0.78); ctl2d.stroke();
    // reflet verrière
    const vg = ctl2d.createLinearGradient(0,0,W,H*0.5);
    vg.addColorStop(0,'rgba(180,220,255,0.05)'); vg.addColorStop(1,'rgba(180,220,255,0)');
    ctl2d.fillStyle = vg; ctl2d.fillRect(0,0,W,H);
    ctl2d.restore();
  }
}

/* ------------------------------------------------------------------ */
/*  boucle                                                             */
/* ------------------------------------------------------------------ */
const FIXED = 1 / 120;
let acc = 0, last = performance.now(), fpsT = 0, fpsN = 0, frameN = 0;

function frame(now) {
  const dtReal = Math.min((now - last) / 1000, 0.25);
  last = now;
  fpsT += dtReal; fpsN++;
  if (fpsT > 0.5) { hudFps.textContent = (fpsN / fpsT).toFixed(0); fpsT = 0; fpsN = 0; }

  const kb = keyboard();
  const ex = v => v * 0.55 + 0.45 * v * v * v;      // expo : doux au centre
  target.elev = clamp(ex(stick.on ? stick.dy : kb.e), -1, 1);
  target.ail  = clamp(ex(stick.on ? stick.dx : kb.a), -1, 1);
  if (kb.t !== null) throttle = lerp(throttle, kb.t, 0.08);
  target.thr = throttle;
  if (throttle > 0.06) hintEl.classList.add('off');
  if (rudTouch.on) target.rud = rudTouch.dir;
  else if (K('KeyQ') || K('KeyE')) target.rud = kb.r;
  else target.rud = 0;

  if (!crashed) {
    acc += Math.min(dtReal, 0.1);
    let guard = 0;
    while (acc >= FIXED && guard++ < 16) { step(FIXED); acc -= FIXED; }
    if (acc > 0.2) acc = 0;
  } else {
    acc = 0;
  }

  updateCamera(dtReal);
  sky.position.copy(camera.position);
  updateHUD();

  // ombre portée + ombres dynamiques qui suivent l'avion
  {
    const gy = groundAt(pos.x, pos.z) + 0.12;
    const agl = clamp(pos.y - gy, 0, 250);
    shadowMesh.position.set(pos.x, gy, pos.z);
    const sc = 13 + agl * 0.09;
    shadowMesh.scale.set(sc, 1, sc * 1.15);
    shadowMesh.material.opacity = 0.22 * clamp(1 - agl / 120, 0.06, 1);
    shadowMesh.rotation.y = Math.atan2(-_fwd.x, -_fwd.z);

    sun.target.position.copy(pos);
    sun.target.updateMatrixWorld();
    sun.position.copy(pos).addScaledVector(isNight ? MOON_DIR : SUN_DIR, 800);
  }
  waterMat.uniforms.time.value = simT;
  skyMat.uniforms.time.value = simT;
  if (isNight && aircraft.userData.nav) aircraft.userData.nav.beacon.visible = (simT % 1.15) < 0.12;
  updateContrails(dtReal);

  drawControls();
  drawAH();
  if ((frameN++ & 3) === 0) { drawMap(); updateAudio(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  sizeCtl();
});

document.getElementById('msg').addEventListener('pointerdown', () => reset());

reset();
camPos.set(pos.x, pos.y + 12, pos.z + 30);
applyDayNight();
requestAnimationFrame(frame);
setTimeout(buildMap, 400);

/* sonde de diagnostic (utilisée par les tests, sans effet sur le jeu) */
window.__setState = (s) => {
  if (s.plane != null) setPlane(s.plane);
  if (s.pos) pos.set(s.pos[0], s.pos[1], s.pos[2]);
  if (s.vel) vel.set(s.vel[0], s.vel[1], s.vel[2]);
  if (s.quat) quat.set(s.quat[0], s.quat[1], s.quat[2], s.quat[3]).normalize();
  if (s.omega) omega.set(s.omega[0], s.omega[1], s.omega[2]);
  if (s.onGround != null) onGround = s.onGround;
  if (s.crashed != null) { crashed = s.crashed; if (!crashed) document.getElementById('msg').classList.remove('on'); }
  if (s.throttle != null) { throttle = s.throttle; ctrl.thr = s.throttle; target.thr = s.throttle; }
  if (s.cm0 != null) AC.Cm0 = s.cm0;
  lastGh = groundAt(pos.x, pos.z);
};
window.__dbg = () => {
  _fwd.set(0, 0, -1).applyQuaternion(quat);
  _up.set(0, 1, 0).applyQuaternion(quat);
  return {
    alt: +pos.y.toFixed(2), vy: +vel.y.toFixed(2), spd: +vel.length().toFixed(1),
    x: +pos.x.toFixed(1), z: +pos.z.toFixed(1),
    aoa: +(aoaLive / D2R).toFixed(1), pitch: +(Math.asin(clamp(_fwd.y, -1, 1)) / D2R).toFixed(1),
    upY: +_up.y.toFixed(3), fwdY: +_fwd.y.toFixed(3),
    thrust: +ctrl.thr.toFixed(2), ground: onGround, crash: crashed, t: +simT.toFixed(1),
    plane: PLANES[planeIdx].name, gearAnim: +gearAnim.toFixed(2), gearDown, night: isNight, planes: PLANES.length
  };
};
window.__toggleGear = toggleGear;
window.__toggleNight = toggleNight;
</script>
