<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{position:fixed;inset:0;overflow:hidden;background:#0b1016;

  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  #hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;

  :root{--st:calc(max(env(safe-area-inset-top,0px),22px) + 10px)}
  #hud{position:absolute;left:14px;top:var(--st);padding:10px 12px;border-radius:10px;

  #hud .r{display:flex;justify-content:space-between;gap:14px}

  #btns{position:absolute;right:12px;top:var(--st);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(50vw - 84px)}

  #stall{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);font-size:26px;font-weight:700;

  #pmenu{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:56px;background:rgba(6,10,14,.45);backdrop-filter:blur(3px);pointer-events:auto}

  #ah{position:absolute;left:50%;top:var(--st);bottom:auto;transform:translateX(-50%);width:124px;height:124px;

  #map{position:absolute;left:14px;top:calc(var(--st) + 184px);right:auto;bottom:auto;width:112px;height:112px;pointer-events:none;opacity:.9;
    border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  #msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#e8f2fb;

    font-size:13px;pointer-events:none;border:1px solid rgba(255,214,90,.35);white-space:nowrap}
  #race.on{display:flex}
  #race .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:#ffd65a}
  #race .s{opacity:.7;font-size:11px;letter-spacing:.05em}
  #cbt{position:absolute;left:50%;top:calc(var(--st) + 132px);transform:translateX(-50%);display:none;align-items:center;gap:14px;
    padding:8px 14px;border-radius:12px;background:rgba(8,14,20,.6);backdrop-filter:blur(6px);color:#e8f4ff;
    font-size:13px;pointer-events:none;border:1px solid rgba(255,90,70,.4);white-space:nowrap}
  #cbt.on{display:flex}

  #cbt .hp{width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}

  #cmenu{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding-top:56px;background:rgba(6,10,14,.45);backdrop-filter:blur(3px);pointer-events:auto}
  #cmenu.on{display:flex}
  #cmenu .card,#rmenu .card{background:rgba(10,16,22,.94);border:1px solid rgba(170,210,240,.18);border-radius:14px;padding:12px 14px;max-width:min(520px,92vw);max-height:76vh;overflow:auto;color:#dbe9f5}
  #cmenu .title,#rmenu .title{font-size:12px;letter-spacing:.12em;opacity:.6;margin:8px 2px 8px}
  #cmenu .sw{display:flex;flex-wrap:wrap;gap:8px}

  #cmenu .num{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700}
  #cmenu .num button,#cmenu .row button,#rmenu .pi{font:inherit;font-size:14px;color:#dfeefb;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 14px}

<script type="module">
import * as THREE from './three.module.js';

/* ------------------------------------------------------------------ */
/*  utilitaires                                                        */
/* ------------------------------------------------------------------ */
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const lerp  = (a, b, t) => a + (b - a) * t;
const D2R   = Math.PI / 180;
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

/* ------------------------------------------------------------------ */
/*  bruit déterministe                                                 */
/* ------------------------------------------------------------------ */
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123; return s - Math.floor(s); }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * noise2(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return s;
}

/* ------------------------------------------------------------------ */
/*  terrain : grande île ~33 km, chaînes de montagnes, archipel     */
/* ------------------------------------------------------------------ */
const RW_Y = 4.2;          // altitude des surfaces bétonnées
const PL_Y = RW_Y - 0.35;  // plaine autour, juste en dessous

// Surfaces dures : pistes, taxiways, aires (rectangles axis-aligned en x/z)
const RUNWAYS = [
  { x: 0, z: 0, w: 36, l: 1400, name: '18/36' },      // piste nord-sud
  { x: 0, z: 80, w: 1000, l: 30, name: '09/27' },     // piste est-ouest croisant la première
  { x: -12500, z: -10500, w: 34, l: 1300, name: '04/22' } // aérodrome de l'île du Nord-Ouest
];
const TAXIWAYS = [
  { x: -260, z: -520, w: 18, l: 420 },
  { x: -260, z: -310, w: 260, l: 18 },
  { x: 260, z: 520, w: 18, l: 420 },
  { x: 260, z: 310, w: 260, l: 18 },
  { x: 0, z: -310, w: 520, l: 18 },
  { x: 0, z: 310, w: 520, l: 18 },
  { x: -12420, z: -10500, w: 160, l: 18 },             // bretelle aérodrome NO
  { x: -12340, z: -10500, w: 18, l: 220 }
];
const AIRPORTS = [
  { name: 'Aéroport principal', x: 0, z: 560, hdg: 0 },
  { name: 'Aérodrome Nord-Ouest', x: -12500, z: -9950, hdg: 0 }
];
// porte-avions au large (pont dur à DECK_Y, brins d'arrêt à l'arrière, catapulte à l'avant)
const CARRIER = { x: 0, z: 21000, w: 40, l: 320, deckY: 20, wires: [116, 126, 136, 146] };
const onCarrier = (x, z) => Math.abs(x - CARRIER.x) < CARRIER.w / 2 && Math.abs(z - CARRIER.z) < CARRIER.l / 2;
AIRPORTS.push({ name: 'Porte-avions', x: CARRIER.x, z: CARRIER.z + 128, y: CARRIER.deckY, carrier: true });
var airportIdx = 0;
const HARD = [...RUNWAYS, ...TAXIWAYS];

function inRectXZ(x, z, r) { return Math.abs(x - (r.x||0)) < r.w/2 && Math.abs(z - (r.z||0)) < r.l/2; }
function onHardSurface(x, z) { return HARD.some(r => inRectXZ(x, z, r)); }
const onRunway = (x, z) => onHardSurface(x, z) || onCarrier(x, z); // compat (+ pont du porte-avions)

// îlots au large, pour un horizon moins vide
const ISLETS = [
  { x: 15800, z: -10800, r: 2600, h: 180 },
  { x: -14700, z: 3900, r: 2300, h: 190 },
  { x: 6300, z: 19800, r: 3200, h: 880, volcano: true },   // volcan
  { x: 21300, z: 10200, r: 2200, h: 140 },
  { x: -6900, z: -22800, r: 1900, h: 110 },
  { x: 23400, z: -21900, r: 1800, h: 100 },
  { x: -23100, z: 18900, r: 2600, h: 170 },
  { x: 25000, z: 1500, r: 1500, h: 90 },
  { x: -2500, z: 25500, r: 1700, h: 120 },
  { x: -25500, z: -4000, r: 2100, h: 150 }
];
// chaînes de montagnes : crêtes le long d'une ligne de sommets
const RANGES = [
  { pts: [[3500,-5200],[7500,-9000],[12000,-11500],[16500,-9500],[18500,-4500],[18000,1500]], w: 3600, h: 2300 },
  { pts: [[-5200,4800],[-9000,8800],[-13500,10200],[-17500,8200]], w: 3000, h: 1700 },
  { pts: [[-10000,-14900],[-13800,-14300]], w: 2000, h: 1100 }   // massif de l'île Nord-Ouest
];
function segDist(x, z, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(x - ax - dx * t, z - az - dz * t);
}
function rangeHeight(x, z) {
  let best = 0;
  for (const R of RANGES) {
    let d = 1e9;
    for (let i = 0; i < R.pts.length - 1; i++) d = Math.min(d, segDist(x, z, R.pts[i][0], R.pts[i][1], R.pts[i+1][0], R.pts[i+1][1]));
    if (d >= R.w) continue;
    const f = Math.pow(1 - d / R.w, 1.6);
    const n = fbm(x * 0.00035 + 4.4, z * 0.00035 - 2.2, 5);
    const ridged = 1 - Math.abs(2 * fbm(x * 0.0009 - 1.7, z * 0.0009 + 3.3, 4) - 1);  // arêtes vives
    best = Math.max(best, R.h * f * (0.45 + 0.55 * n) * (0.55 + 0.6 * ridged * ridged));
  }
  return best;
}
// grande île secondaire (relief doux) qui porte le 2e aérodrome
const ISLAND2 = { x: -12000, z: -10200, r: 4600 };

// --- grands décors : ville côtière (est), canyon (ouest), volcan (îlot sud)
const CITY = { x: 10600, z: 6000, r: 1900, R: 3000 };
const CANYON = { fw: 110, rw: 400, floor: -12,
  ctrl: [[-7200,-17200],[-6900,-13600],[-7500,-10400],[-6300,-7200],[-7100,-4000],[-6000,-900],[-6900,2300],[-5900,5600],[-6700,8800],[-6100,11800],[-6400,15800]] };
// ligne centrale lissée (Catmull-Rom), un point tous les ~40 m, z croissant
const CANY_P = (() => {
  const C = CANYON.ctrl, out = [];
  for (let i = 0; i < C.length - 1; i++) {
    const p0 = C[Math.max(i - 1, 0)], p1 = C[i], p2 = C[i + 1], p3 = C[Math.min(i + 2, C.length - 1)];
    const n = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 40);
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  out.push(C[C.length - 1].slice());
  return out;
})();
function canyonDist(x, z) {
  const P = CANY_P, W = CANYON.rw + 260;
  if (x < -9800 || x > -3600 || z < P[0][1] - W || z > P[P.length - 1][1] + W) return 1e9;
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][1] < z) lo = m; else hi = m; }
  if (Math.abs(x - P[lo][0]) > W) return 1e9;
  let d = 1e9;
  for (let i = Math.max(lo - 22, 0); i < Math.min(lo + 22, P.length - 1); i++) d = Math.min(d, segDist(x, z, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1]));
  return d;
}
function canyonCarve(h, x, z) {
  const d = canyonDist(x, z);
  if (d >= CANYON.rw || h <= CANYON.floor) return h;
  const s = smoothstep(CANYON.fw, CANYON.rw, d);
  return CANYON.floor + (h - CANYON.floor) * s;
}
function cityMask(x, z) { return 1 - smoothstep(CITY.r, CITY.R, Math.hypot(x - CITY.x, z - CITY.z)); }

function airportMask(x, z) {
  // zone aplatie couvrant les deux pistes et les taxiways
  const d1 = Math.max(Math.abs(x) - 80, Math.abs(z) - 780);
  const d2 = Math.max(Math.abs(x) - 580, Math.abs(z - 80) - 70);
  const d3 = Math.max(Math.abs(x) - 320, Math.abs(z) - 360);
  const d = Math.min(d1, d2, d3);
  // aérodrome Nord-Ouest
  const d4 = Math.max(Math.abs(x + 12460) - 140, Math.abs(z + 10500) - 760);
  return Math.max(1 - smoothstep(40, 260, d), 1 - smoothstep(40, 420, d4));
}

function terrainHeight(x, z) {
  const r = Math.hypot(x, z);
  const R = 16500;
  let mask = 1 - smoothstep(R * 0.55, R, r);
  mask = Math.pow(mask, 1.2);
  const mtn = smoothstep(2300, 4600, r);          // relief repoussé loin de la piste

  const n = fbm(x * 0.00007 + 11.3, z * 0.00007 - 4.7, 5);
  const ridge = fbm(x * 0.00021 + 3.1, z * 0.00021 + 8.2, 4);
  let h = (n * 820 + ridge * ridge * 780) * mask * mtn;
  h += 6 * mask - 45 * (1 - mask);
  // chaînes de montagnes (gardées loin de l'aéroport principal)
  const rg = rangeHeight(x, z) * smoothstep(2600, 5200, r);
  if (rg > 0) h = Math.max(h, -40 + rg);

  for (const is of ISLETS) {
    const dd = Math.hypot(x - is.x, z - is.z);
    const rr = is.r * (0.82 + 0.36 * fbm(x * 0.0006 + is.x, z * 0.0006 - is.z, 3)); // côtes irrégulières
    if (is.volcano) {
      const rv = is.r * (0.9 + 0.2 * fbm(x * 0.0006 + 3.3, z * 0.0006 - 1.1, 3));
      if (dd < rv) {
        const cone = (q) => -30 + (is.h + 30) * Math.pow(1 - q / rv, 1.7) * (0.92 + 0.16 * fbm(x * 0.003, z * 0.003, 3));
        const CR = 460;
        h = Math.max(h, dd < CR ? cone(CR) - 210 * (1 - (dd / CR) * (dd / CR)) : cone(dd));
      }
      continue;
    }
    if (dd < rr) {
      const f = 1 - dd / rr;
      h = Math.max(h, -30 + f * f * (is.h + 45) * (0.7 + 0.6 * fbm(x * 0.002, z * 0.002, 3)));
    }
  }
  {
    const dd = Math.hypot(x - ISLAND2.x, z - ISLAND2.z);
    const rr = ISLAND2.r * (0.8 + 0.4 * fbm(x * 0.00045 + 7.7, z * 0.00045 + 1.9, 4));
    if (dd < rr) {
      const f = smoothstep(0, 0.35, 1 - dd / rr);
      const hills = 8 + fbm(x * 0.0005 - 2.3, z * 0.0005 + 6.1, 4) * 260 * smoothstep(1300, 2600, Math.hypot(x + 12460, z + 10500));
      h = Math.max(h, lerp(-30, hills, f));
    }
  }

  // ville : terrain aplati (sans toucher à la mer)
  { const cm = cityMask(x, z); if (cm > 0 && h > 0) h = lerp(h, PL_Y, cm); }
  // canyon creusé jusqu'au niveau de la mer
  h = canyonCarve(h, x, z);
  const flat = smoothstep(900, 2400, r);
  h = PL_Y + (h - PL_Y) * flat;
  // aplatir l'emprise aéroport
  const ap = airportMask(x, z);
  h = lerp(h, PL_Y, ap);
  return h;
}

function groundAt(x, z) {
  if (onCarrier(x, z)) return CARRIER.deckY;
  return onHardSurface(x, z) ? RW_Y : terrainHeight(x, z);
}

const OBST = [], OB_CELL = 200, obGrid = new Map();
function addObstacle(o) {
  OBST.push(o);
  const R = o.br + 12;
  for (let i = Math.floor((o.x - R) / OB_CELL); i <= Math.floor((o.x + R) / OB_CELL); i++)
    for (let j = Math.floor((o.z - R) / OB_CELL); j <= Math.floor((o.z + R) / OB_CELL); j++) {
      const k = i * 100003 + j; let a = obGrid.get(k); if (!a) obGrid.set(k, a = []); a.push(o);
    }
}
function obBox(x, z, hu, hv, ang, y0, y1) {   // demi-longueurs le long de (cos ang, sin ang) et de la perpendiculaire
  addObstacle({ t: 0, x, z, hu, hv, ax: Math.cos(ang), az: Math.sin(ang), y0, y1, br: Math.hypot(hu, hv) });
}
function obCyl(x, z, r, y0, y1) { addObstacle({ t: 1, x, z, r, y0, y1, br: r }); }
function hitObstacle(p, m) {
  const a = obGrid.get(Math.floor(p.x / OB_CELL) * 100003 + Math.floor(p.z / OB_CELL));
  if (!a) return null;
  for (const o of a) {
    if (p.y < o.y0 - m || p.y > o.y1 + m) continue;
    const dx = p.x - o.x, dz = p.z - o.z;
    if (o.t === 1) { if (dx * dx + dz * dz < (o.r + m) * (o.r + m)) return o; }
    else {
      const u = dx * o.ax + dz * o.az, v = -dx * o.az + dz * o.ax;
      if (Math.abs(u) < o.hu + m && Math.abs(v) < o.hv + m) return o;
    }
  }
  return null;
}

// --- le canyon : parois détaillées (bandes de roche colorées) au-dessus du relief grossier
{
  const P = CANY_P, HW = CANYON.rw + 150, COLS = 72;
  const step = 2;                                     // un rang tous les ~80 m
  const rows = Math.floor((P.length - 1) / step) + 1;
  const pos = new Float32Array(rows * (COLS + 1) * 3), colA = new Float32Array(rows * (COLS + 1) * 3);
  const STRATA = [0xb4532e, 0xc8743f, 0xa4462c, 0xd9a066, 0xb86a3c, 0xe2c08a, 0x9b4a30, 0xc98a52].map(h => new THREE.Color(h));
  const cGrass = new THREE.Color(0x4e7a45), cRock = new THREE.Color(0x7a756c), cSand = new THREE.Color(0xd6c49a), tmp = new THREE.Color();
  for (let r = 0; r < rows; r++) {
    const k = Math.min(r * step, P.length - 2);
    const a = P[Math.max(k - 1, 0)], b = P[Math.min(k + 1, P.length - 1)];
    const tx = b[0] - a[0], tz = b[1] - a[1], tl = Math.hypot(tx, tz), nx = tz / tl, nz = -tx / tl;
    for (let c = 0; c <= COLS; c++) {
      const u = c / COLS * 2 - 1, s = Math.sign(u) * Math.pow(Math.abs(u), 1.25) * HW;   // plus de points près du fond
      const x = P[k][0] + nx * s, z = P[k][1] + nz * s;
      const y = terrainHeight(x, z);
      const i = (r * (COLS + 1) + c) * 3;
      pos[i] = x; pos[i + 1] = y; pos[i + 2] = z;
      const d = Math.abs(s);
      const band = STRATA[((Math.floor((y + 40) / 34) % STRATA.length) + STRATA.length) % STRATA.length];
      tmp.copy(band).multiplyScalar(0.86 + 0.28 * fbm(x * 0.01, y * 0.03, 2));
      const outer = smoothstep(CANYON.rw - 40, HW - 20, d);     // vers le bord : couleur du terrain normal
      const terr = new THREE.Color().copy(cGrass).lerp(cRock, smoothstep(200, 520, y));
      if (y < 6) tmp.copy(cSand);
      tmp.lerp(terr, outer);
      colA[i] = tmp.r; colA[i + 1] = tmp.g; colA[i + 2] = tmp.b;
    }
  }
  const idx = [];
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < COLS; c++) {
    const a = r * (COLS + 1) + c, b = a + COLS + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // orientation des triangles : on vérifie qu'ils regardent vers le haut
  { const n = geo.attributes.normal; let up = 0; for (let i = 0; i < n.count; i++) up += n.getY(i); if (up < 0) { for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; } geo.setIndex(idx); geo.computeVertexNormals(); } }
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// --- le pont suspendu au-dessus du canyon
{
  const P = CANY_P;
  let k = 0; for (let i = 0; i < P.length; i++) if (Math.abs(P[i][1] + 1200) < Math.abs(P[k][1] + 1200)) k = i;
  const tx0 = P[k + 1][0] - P[k - 1][0], tz0 = P[k + 1][1] - P[k - 1][1], tl = Math.hypot(tx0, tz0);
  const tx = tx0 / tl, tz = tz0 / tl, nx = tz, nz = -tx;           // n : axe du pont (d'une rive à l'autre)
  const cx = P[k][0], cz = P[k][1];
  const half = CANYON.rw + 70;
  const deckY = Math.min(terrainHeight(cx + nx * (CANYON.rw + 50), cz + nz * (CANYON.rw + 50)), terrainHeight(cx - nx * (CANYON.rw + 50), cz - nz * (CANYON.rw + 50))) + 1;
  const TW = 165, TOP = deckY + 150, WID = 26;
  const orange = new THREE.MeshLambertMaterial({ color: 0xc4452c });
  const g = new THREE.Group();
  const ang = Math.atan2(nz, nx);
  g.position.set(cx, 0, cz); g.rotation.y = -ang;                  // x local = axe du pont, z local = largeur
  const box = (w, h, d, x, y, z, m = orange) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); g.add(o); return o; };
  box(2 * half, 5, WID, 0, deckY - 2.5, 0);                         // tablier
  box(2 * half, 0.4, WID - 6, 0, deckY + 0.2, 0, new THREE.MeshLambertMaterial({ color: 0x34373c }));
  box(2 * half, 1.2, 0.5, 0, deckY + 0.8, WID / 2 - 0.3); box(2 * half, 1.2, 0.5, 0, deckY + 0.8, -WID / 2 + 0.3);
  const yb = CANYON.floor - 20;
  for (const s of [-1, 1]) {
    for (const w of [-1, 1]) box(7, TOP - yb, 7, s * TW, (TOP + yb) / 2, w * (WID / 2 + 1));
    for (const yy of [deckY - 24, deckY + 62, TOP - 6]) box(7, 8, WID + 10, s * TW, yy, 0);
    box(10, 3, 10, s * TW, TOP + 2, WID / 2 + 1, new THREE.MeshBasicMaterial({ color: 0xff2a1a }));
  }
  // câbles porteurs : rive → sommet de pylône → creux au centre → pylône → rive
  const cableY = x => {
    const ax = Math.abs(x);
    if (ax <= TW) return deckY + 7 + (TOP - deckY - 7) * (ax / TW) * (ax / TW);
    const t = (ax - TW) / (half - TW); return TOP + (deckY + 3 - TOP) * (t * 0.75 + t * t * 0.25);
  };
  for (const w of [-1, 1]) {
    const pts = []; for (let x = -half; x <= half; x += 10) pts.push(new THREE.Vector3(x, cableY(x), w * (WID / 2 + 1)));
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 180, 1.1, 6), orange);
    g.add(tube);
  }
  // suspentes
  const hs = []; for (let x = -half + 16; x < half - 10; x += 14) if (Math.abs(Math.abs(x) - TW) > 8) for (const w of [-1, 1]) hs.push([x, w]);
  const sg = new THREE.BoxGeometry(0.35, 1, 0.35); sg.translate(0, 0.5, 0);
  const sInst = new THREE.InstancedMesh(sg, orange, hs.length), m4 = new THREE.Matrix4();
  hs.forEach(([x, w], i) => { const h = Math.max(cableY(x) - deckY, 0.5); m4.makeScale(1, h, 1); m4.setPosition(x, deckY, w * (WID / 2 + 1)); sInst.setMatrixAt(i, m4); });
  g.add(sInst);
  scene.add(g);
  // collisions (repère monde)
  // z local -> direction (−nz, nx) après rotation.y = −ang
  const px = -nz, pz = nx;
  const at = (lx, lz) => [cx + nx * lx + px * lz, cz + nz * lx + pz * lz];
  { const [x, z] = at(0, 0); obBox(x, z, half, WID / 2, ang, deckY - 6, deckY + 2); }
  for (const s of [-1, 1]) for (const w of [-1, 1]) { const [x, z] = at(s * TW, w * (WID / 2 + 1)); obBox(x, z, 4, 4, ang, yb, TOP + 3); }
  for (const s of [-1, 1]) for (const yy of [deckY - 24, deckY + 62, TOP - 6]) { const [x, z] = at(s * TW, 0); obBox(x, z, 4, WID / 2 + 5, ang, yy - 4, yy + 4); }
  window.__BRIDGE = { x: cx, z: cz, deckY, ang, nx, nz };
}

function updateGroundFx(dt, spd, onG, hard, gh) {
  groundFxT += dt;
  if (onG && spd > 12 && groundFxT > 0.06) {
    groundFxT = 0;
    const mat = new THREE.SpriteMaterial({ map: groundFx.tex, transparent:true, depthWrite:false, opacity: hard?0.16:0.18, color: hard?0xdddddd:0xd2c090 });

    groundFx.group.add(s);
  }
  const kids = groundFx.group.children;
  for (let i=kids.length-1;i>=0;i--){
    const s=kids[i]; s.userData.life+=dt; const t=s.userData.life/s.userData.max;
    if(t>=1){ groundFx.group.remove(s); s.material.dispose(); continue; }

function updateContrails(dt) {
  const v = vel.length();
  const jet = (PLANES[planeIdx].look.prop === 0); // jets/chasseur
  const emit = !crashed && !onGround && jet && v > 55 && ctrl.thr > 0.35;
  contrailT += dt;
  if (emit && contrailT > 0.045) {
    contrailT = 0;
    _fwd.set(0,0,-1).applyQuaternion(quat);
    _right.set(1,0,0).applyQuaternion(quat);
    _up.set(0,1,0).applyQuaternion(quat);
    const halfL = PLANES[planeIdx].look.len / 2;
    const span = PLANES[planeIdx].look.span;
    const sources = planeIdx === 3 ? [ -span*0.48, span*0.48 ] : [0]; // bouts d'aile chasseur, sinon réacteur
    for (const ox of sources) {
      const p = pos.clone().addScaledVector(_fwd, -(halfL + 0.6)).addScaledVector(_right, ox).addScaledVector(_up, -0.1);
      const m = new THREE.Sprite(contrails.mat.clone());
      m.position.copy(p);
      m.scale.set(1.4,1.4,1);
      m.userData.life = 0; m.userData.max = 2.4 + Math.random()*1.4;
      contrails.group.add(m);
    }
  }
  const kids = contrails.group.children;
  for (let i = kids.length - 1; i >= 0; i--) {
    const s = kids[i];
    s.userData.life += dt;
    const t = s.userData.life / s.userData.max;
    if (t >= 1) { contrails.group.remove(s); s.material.dispose(); continue; }
    const sc = 1.4 + t * 6.5;
    s.scale.set(sc, sc * 0.65, 1);
    s.material.opacity = (1 - t) * 0.26;
    s.position.y += dt * 0.35;
  }
}

function makeGlowTexture() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.18, 'rgba(255,255,255,0.9)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.28)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
const GLOW_TEX = makeGlowTexture();
const nightSets = {};
function makeGlow(positions, color, size, opacity, name) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const m = new THREE.PointsMaterial({
    map: GLOW_TEX, color, size, sizeAttenuation: true, transparent: true,
    opacity, depthWrite: false, blending: THREE.AdditiveBlending, fog: true
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false; p.visible = false;
  scene.add(p); nightSets[name] = p; return p;
}

/* --- fabrique de formes ------------------------------------------- */
function loftZ(prof, seg) {
  const pos = [], idx = [];
  for (let i = 0; i < prof.length; i++) {
    const [z, r] = prof[i];
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      pos.push(Math.cos(a) * r, Math.sin(a) * r, z);
    }
  }
  for (let i = 0; i < prof.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * (seg + 1) + j, b = a + seg + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeWing(span, chord, taper, sweep, dihedral, thick, mat) {
  const g = new THREE.BoxGeometry(span, thick, chord, 3, 1, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = Math.abs(p.getX(i)) / (span / 2);
    p.setZ(i, p.getZ(i) * (1 - (1 - taper) * t) + sweep * t);
    p.setY(i, p.getY(i) + dihedral * t * t);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

function makeFin(h, chord, taper, mat) {
  const g = new THREE.BoxGeometry(0.14, h, chord, 1, 3, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) + h / 2) / h;
    p.setZ(i, p.getZ(i) * (1 - (1 - taper) * t) + chord * 0.55 * t);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

  c.lineWidth = 10; c.strokeStyle = bg; c.strokeText(num, 128, 68);
  c.fillStyle = fg; c.fillText(num, 128, 68);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;

}
function buildPlane(P) {

  const half = L.len / 2, r = L.rmax;

    w.position.set(0, y, L.wingZ + zOff);
    g.add(w);

      tip.position.set(sx * L.span*spanMul * 0.485, y + L.dihedral * 0.93, L.wingZ + zOff + L.sweep * 0.93);
      g.add(tip);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(L.span*spanMul * 0.22, L.chord * 0.02, L.chord * 0.18), matAcc);
      stripe.position.set(sx * L.span*spanMul * 0.22, y + L.dihedral * 0.18 + L.chord * 0.065, L.wingZ + zOff + L.sweep * 0.22 + L.chord * 0.05);
      g.add(stripe);

  };
  addWingAt(L.wingY);
  if (L.biplane) {
    addWingAt(L.wingY - 0.85, 0.25, 0.95);

    for (const sx of [-1, 1]) for (const zz of [-0.1, 0.35]) {

  // stabilisateur + dérive

  stab.position.set(0, L.stabY, L.tailZ);
  g.add(stab);
  const fin = makeFin(L.finH, L.finChord, 0.55, matBody);

  const finTip = new THREE.Mesh(new THREE.BoxGeometry(0.16, L.finH * 0.16, L.finChord * 0.5), matAcc);
  finTip.position.set(0, L.finH * 0.93 + 0.1, L.finZ + L.finChord * 0.33);

  // verrière
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), matGlass);

  g.add(canopy);

  // armement léger décoratif (avion de chasse)
  if (L.nozzle) {
    for (const sx of [-1, 1]) {
      const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, L.span * 0.18, 6), matDark);
      rail.rotation.z = Math.PI / 2;
      rail.position.set(sx * L.span * 0.42, L.wingY - 0.18, L.wingZ + L.sweep * 0.42);
      g.add(rail);
      const tipm = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.7, 8), matAcc);

  if (L.gear) {

    for (const sx of [-1, 1]) {
      const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.5, 6), matDark);
      strut.position.set(sx * L.span * 0.16, -0.45, L.wingZ + 0.25);

  if (L.prop) {

    noz.rotation.x = Math.PI / 2;

    g.add(noz);
    const core = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.9, 10), matAcc);

    g.add(core);
    for (const sx of [-1, 1]) {
      const intake = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 2.4), matBody);
      intake.position.set(sx * 0.55, -0.18, -half * 0.15);

    const flameMat = new THREE.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false });
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.26, 2.2, 10), flameMat);

}

/*  modèle de vol (6 degrés de liberté, coefficients type C172)        */
/* ------------------------------------------------------------------ */
const AC = Object.assign({ g: 9.81 }, PLANES[0].perf);
const GEAR_H = 1.15;
const BELLY_H = 0.55;
const A_STALL = 0.28;                 // ~16 degrés

const pos   = new THREE.Vector3(0, RW_Y + GEAR_H, 560);
const vel   = new THREE.Vector3();
const quat  = new THREE.Quaternion();
const omega = new THREE.Vector3();
// état précédent / rendu interpolé (supprime le tremblement dû au pas fixe de la physique)
const prevPos = new THREE.Vector3(), prevQuat = new THREE.Quaternion();
const rPos = new THREE.Vector3(), rQuat = new THREE.Quaternion();

const ctrl   = { elev: 0, ail: 0, rud: 0, thr: 0 };
const target = { elev: 0, ail: 0, rud: 0, thr: 0 };

let onGround = true, crashed = false, stallLevel = 0, aoaLive = 0;
const hook = { armed: false, caught: false }, cat = { armed: false, fired: false };
let lastGh = 0, simT = 0, throttle = 0;
let gearDown = true, gearAnim = 1; // 1 = sorti, 0 = rentré
const gearExtendable = () => !!PLANES[planeIdx].look.retractable;
const gearEffectiveH = () => gearExtendable() ? lerp(BELLY_H, GEAR_H, gearAnim) : GEAR_H;

const _qI = new THREE.Quaternion(), _vb = new THREE.Vector3(), _vbN = new THREE.Vector3();
const _Fb = new THREE.Vector3(), _Fw = new THREE.Vector3(), _T = new THREE.Vector3();
const _Iw = new THREE.Vector3(), _cr = new THREE.Vector3(), _fwd = new THREE.Vector3();

function reset() {
  const h = gearEffectiveH();
  const ap0 = AIRPORTS[airportIdx];
  pos.set(ap0.x, (ap0.y ?? RW_Y) + GEAR_H, ap0.z);
  vel.set(0, 0, 0);
  quat.identity();
  omega.set(0, 0, 0);
  ctrl.elev = ctrl.ail = ctrl.rud = ctrl.thr = 0;
  target.elev = target.ail = target.rud = target.thr = 0;
  throttle = 0;
  crashed = false;
  gearDown = true; gearAnim = 1;
  AC.Cm0 = PLANES[planeIdx].perf.Cm0;
  pos.y = (ap0.y ?? RW_Y) + h;
  hook.caught = false; hook.armed = false; cat.armed = !!ap0.carrier; cat.fired = false;
  if (typeof raceAbort === 'function') raceAbort();
  if (typeof combatStop === 'function') combatStop();
  document.getElementById('msg').firstChild.textContent = 'CRASH';
  lastGh = groundAt(pos.x, pos.z);
  if (typeof resetContrails === 'function') resetContrails();
  if (typeof resetGroundFx === 'function') resetGroundFx();
  prevPos.copy(pos); prevQuat.copy(quat); rPos.copy(pos); rQuat.copy(quat);
  camInit = false;
  document.getElementById('msg').classList.remove('on');
}

function crash() {
  if (crashed) return;
  crashed = true;
  document.getElementById('msg').classList.add('on');
}

function step(dt) {
  simT += dt;

  const k = 1 - Math.exp(-dt * (PLANES[planeIdx].perf.ctrlRate || 9));
  ctrl.elev = lerp(ctrl.elev, target.elev, k);
  ctrl.ail  = lerp(ctrl.ail,  target.ail,  k);
  ctrl.rud  = lerp(ctrl.rud,  target.rud,  k);
  ctrl.thr  = lerp(ctrl.thr,  target.thr,  k);

  const rho = 1.225 * Math.exp(-Math.max(pos.y, 0) / 8500);
  _qI.copy(quat).invert();
  _vb.copy(vel).applyQuaternion(_qI);

  const u  = -_vb.z;
  const vs =  _vb.x;
  const wd = -_vb.y;
  const V  = Math.max(Math.sqrt(_vb.lengthSq()), 0.05);
  const alpha = V > 2 ? Math.atan2(wd, u) : 0;
  const beta  = V > 2 ? Math.atan2(vs, Math.hypot(u, wd) + 0.001) : 0;
  aoaLive = alpha;

  const aAbs = Math.abs(alpha), sg = alpha < 0 ? -1 : 1;
  let CL;
  if (aAbs < A_STALL) CL = AC.CL0 + AC.CLa * alpha;
  else {
    const peak = AC.CL0 + AC.CLa * A_STALL * sg;
    CL = peak * Math.max(0.5, 1 - (aAbs - A_STALL) * 1.8);
  }
  const stall = clamp((aAbs - A_STALL) / 0.22, 0, 1);
  stallLevel = stall;

  // auto-centrage (trim) : seulement en vol stabilisé, manche au neutre
  // désactivé en manœuvre (traction, forte assiette, rotation) pour permettre les loopings
  if (!onGround && Math.abs(ctrl.elev) < 0.07 && Math.abs(ctrl.ail) < 0.15 && !crashed) {
    const pitchAbs = Math.abs(Math.asin(clamp(_fwd.set(0, 0, -1).applyQuaternion(quat).y, -1, 1)));
    const qRate = Math.abs(omega.x);
    if (pitchAbs < 0.45 && qRate < 0.55) {
      const want = clamp(alpha, -0.03, 0.19);
      const cible = -AC.Cm_a * want;
      AC.Cm0 += (cible - AC.Cm0) * (1 - Math.exp(-dt * 0.45));
    }
  }

  const CD = AC.CD0 + AC.k * CL * CL + 0.85 * stall * Math.abs(Math.sin(alpha));

  const qbar = 0.5 * rho * V * V;
  const lift = qbar * AC.S * CL;
  const drag = qbar * AC.S * CD;
  const side = qbar * AC.S * AC.CY_b * beta;

  // poussée conservée en montée (favorise les figures), chute progressive à très haute vitesse
  const thrAvail = AC.Tmax * (1 - 0.35 * Math.pow(clamp(V / AC.Vmax, 0, 1.4), 2)) * Math.exp(-Math.max(pos.y, 0) / 12000);
  const T = Math.max(0, thrAvail) * ctrl.thr;

  _Fb.set(0, lift, 0);
  _vbN.copy(_vb).normalize();
  _Fb.addScaledVector(_vbN, -drag);
  _Fb.x += side;
  _Fb.z -= T;

  _Fw.copy(_Fb).applyQuaternion(quat);
  _Fw.y -= AC.m * AC.g;

  // --- moments
  const p = -omega.z, q = omega.x, r = -omega.y;
  const nV = 2 * Math.max(V, 1);
  const pitchNow = Math.asin(clamp(_fwd.set(0, 0, -1).applyQuaternion(quat).y, -1, 1));
  // un peu plus d'autorité en profondeur aux commandes franches (aérobatie), sans nuire au vol stabilisé
  const elevEff = ctrl.elev * (1 + 0.35 * Math.abs(ctrl.elev));
  let M = qbar * AC.S * AC.c * (AC.Cm0 + AC.Cm_a * alpha + AC.Cm_de * elevEff + AC.Cm_q * (q * AC.c / nV));
  if (onGround && pitchNow < 0.05) {
    // appui du train avant : moment constant tant que la roue touche
    if (pitchNow > -0.005) M -= AC.nwLoad;
    else M += -pitchNow * 400000 - omega.x * 20000;
  }
  const L = qbar * AC.S * AC.b * (AC.Cl_b * beta + AC.Cl_p * (p * AC.b / nV) + AC.Cl_da * ctrl.ail + AC.Cl_r * (r * AC.b / nV));
  let N = qbar * AC.S * AC.b * (AC.Cn_b * beta + AC.Cn_r * (r * AC.b / nV) + AC.Cn_da * ctrl.ail);

  const rudCmd = clamp(ctrl.rud + clamp(beta * 3.5, -0.5, 0.5) + clamp(p * 0.04, -0.2, 0.2), -1, 1);
  N += qbar * AC.S * AC.b * AC.Cn_dr * rudCmd;

  _T.set(M, -N, -L);
  if (stall > 0.05) {
    // chute d'aile : dépend du glissement, avec une légère instabilité
    const wd = clamp(beta * 8, -1, 1) + 0.22 * Math.sin(simT * 2.3);
    _T.z += -stall * 1300 * wd;
  }

  _Iw.set(AC.Ix * omega.x, AC.Iy * omega.y, AC.Iz * omega.z);
  _cr.copy(omega).cross(_Iw);
  omega.x += (_T.x - _cr.x) / AC.Ix * dt;
  omega.y += (_T.y - _cr.y) / AC.Iy * dt;
  omega.z += (_T.z - _cr.z) / AC.Iz * dt;
  omega.multiplyScalar(1 - dt * 0.4);

  const dq = new THREE.Quaternion(omega.x * dt * 0.5, omega.y * dt * 0.5, omega.z * dt * 0.5, 1);
  quat.multiply(dq).normalize();

  // --- translation
  vel.addScaledVector(_Fw, dt / AC.m);
  pos.addScaledVector(vel, dt);

  // animation train
  if (gearExtendable()) {
    const targetG = gearDown ? 1 : 0;
    gearAnim = clamp(gearAnim + (targetG - gearAnim) * (1 - Math.exp(-dt * 3.2)), 0, 1);
    if (aircraft.userData.gearGroup) {
      const gg = aircraft.userData.gearGroup;
      gg.position.y = -0.55 * (1 - gearAnim);
      gg.scale.y = 0.15 + 0.85 * gearAnim;
    }
  } else { gearDown = true; gearAnim = 1; }

  // --- sol
  const gh = groundAt(pos.x, pos.z);
  const wasAir = !onGround;
  const effH = gearEffectiveH();
  onGround = false;
  if (gh > lastGh + 0.35 && Math.hypot(vel.x, vel.z) > 10 && pos.y < gh + effH + 0.6) crash();   // relief qui monte trop vite (seulement au ras du sol)
  lastGh = gh;
  if (pos.y < gh + effH) {
    const impact = vel.y;
    const speedH = Math.hypot(vel.x, vel.z);
    const belly = gearAnim < 0.3;
    if (impact < -3.5 || (wasAir && !onRunway(pos.x, pos.z) && speedH > 12 && impact < -1.2)) crash();
    if (belly && wasAir && speedH > 8) crash(); // atterrissage train rentré
    pos.y = gh + effH;
    vel.y = 0;
    onGround = true;
    if (wasAir && typeof spawnGroundBurst === 'function') spawnGroundBurst(speedH, impact);
    // --- porte-avions : brins d'arrêt + catapulte
    if (onCarrier(pos.x, pos.z)) {
      const dz = pos.z - CARRIER.z;
      if (wasAir) { hook.armed = true; cat.armed = false; }
      if (hook.armed && !hook.caught && speedH > 6 && dz > CARRIER.wires[0] - 4 && dz < CARRIER.wires[3] + 4) {
        hook.caught = true; cat.armed = false; toast('Brin accroché !');
      }
      if (hook.caught) {
        const sp0 = Math.hypot(vel.x, vel.z);
        if (sp0 > 0.5) { const f = Math.max(0, sp0 - 32 * dt) / sp0; vel.x *= f; vel.z *= f; }
        else { hook.armed = false; hook.caught = false; toast('Appontage réussi !'); }
      }
      if (cat.armed && ctrl.thr > 0.85 && dz < CARRIER.l / 2 - 20 && speedH < Math.max(AC.Vmax * 0.55, 32)) {
        if (!cat.fired) { cat.fired = true; toast('Catapulte !'); }
        const f2 = _fwd.set(0, 0, -1).applyQuaternion(quat);
        vel.x += f2.x * 34 * dt; vel.z += f2.z * 34 * dt;
      }
    }
    const sp = Math.hypot(vel.x, vel.z);
    const decel = (hook.caught ? 0 : (ctrl.thr > 0.05 ? 0.18 : 1.1)) * dt;
    if (sp > 1e-4) { const f = Math.max(0, sp - decel) / sp; vel.x *= f; vel.z *= f; }
    omega.x *= Math.exp(-dt * 2.5);
    omega.z *= Math.exp(-dt * 7);
    omega.y *= Math.exp(-dt * 1.5);
    if (pitchNow > 0.24 && omega.x > 0) omega.x = 0;
    omega.y -= rudCmd * dt * 2.2 * clamp(1 - speedH / 30, 0, 1);
    if (speedH < 4) {
      const fwd = _fwd.set(0, 0, -1).applyQuaternion(quat);
      const yaw = Math.atan2(-fwd.x, -fwd.z);
      const lvl = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
      quat.slerp(lvl, 1 - Math.exp(-dt * 4));
      omega.set(0, 0, 0);
    }
  }
  if (typeof updateGroundFx === 'function') updateGroundFx(dt, speedHForFx(), onGround, onHardSurface(pos.x,pos.z), gh);
  if (pos.y < 0.6) crash();   // amerrissage
  if (hitObstacle(pos, 2.2)) crash();   // immeuble, tour, pont…

  aircraft.position.copy(pos);
  aircraft.quaternion.copy(quat);
  if (aircraft.userData.prop) aircraft.userData.prop.rotation.z += dt * (8 + ctrl.thr * 120);
  if (aircraft.userData.flame) {
    const f = aircraft.userData.flame;
    const pwr = clamp(ctrl.thr * (1 - clamp((vel.length() - 40) / 120, 0, 0.4)), 0, 1);
    f.visible = pwr > 0.02;
    f.scale.set(1, 0.25 + pwr * 1.6, 1);
    f.material.opacity = 0.18 + pwr * 0.55;
    f.position.z = (PLANES[planeIdx].look.len / 2) + 0.1 + pwr * 0.9;
  }
}

const ctlCanvas = document.getElementById('ctl');
const ctl2d = ctlCanvas.getContext('2d');
function sizeCtl() {

  ctlCanvas.width = innerWidth * d; ctlCanvas.height = innerHeight * d;

const stick = { on: false, id: null, dx: 0, dy: 0, R: 108, gx: 0, gy: 0 };
const thrTouch = { on: false, id: null };
const rudTouch = { on: false, id: null, dir: 0 };
const keys = new Set();

function stickBase() {
  return { x: Math.max(155, Math.min(210, innerWidth * 0.18)), y: innerHeight - 165 };
}

function layout() {
  const W = innerWidth, H = innerHeight;
  return {
    W, H,
    thr: { x0: W - 132, y0: Math.max(176, H * 0.26), x1: W - 14, y1: H - 200 },
    rudL: { x0: W - 306, y0: H - 148, x1: W - 196, y1: H - 46 },
    rudR: { x0: W - 186, y0: H - 148, x1: W - 76, y1: H - 46 },
    fire: { x0: W - 300, y0: H - 268, x1: W - 196, y1: H - 164 }
  };
}
const inRect = (x, y, r) => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1;

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (crashed) { reset(); return; }
  const L = layout(), x = e.clientX, y = e.clientY;
  if (combat.on && inRect(x, y, L.fire)) { combat.fire = true; combat.fireId = e.pointerId; }
  else if (inRect(x, y, L.rudL)) { rudTouch.on = true; rudTouch.id = e.pointerId; rudTouch.dir = -1; }
  else if (inRect(x, y, L.rudR)) { rudTouch.on = true; rudTouch.id = e.pointerId; rudTouch.dir = 1; }
  else if (x > L.thr.x0 - 40 && y > L.thr.y0 - 50) { thrTouch.on = true; thrTouch.id = e.pointerId; setThrFromY(y, L); }
  else if (x < L.W * 0.6) {
    // saisie du manche : on garde le décalage pour éviter tout saut
    const b = stickBase();
    stick.on = true; stick.id = e.pointerId;
    stick.gx = (b.x + stick.dx * stick.R) - x;
    stick.gy = (b.y + stick.dy * stick.R) - y;
    document.getElementById('hint').classList.add('off');
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const L = layout(), x = e.clientX, y = e.clientY;
  if (stick.on && e.pointerId === stick.id) {
    const b = stickBase();
    stick.dx = clamp((x + stick.gx - b.x) / stick.R, -1, 1);
    stick.dy = clamp((y + stick.gy - b.y) / stick.R, -1, 1);
  } else if (thrTouch.on && e.pointerId === thrTouch.id) {
    setThrFromY(y, L);
  }
});
function endPointer(e) {
  if (e.pointerId === stick.id) { stick.on = false; stick.id = null; stick.dx = 0; stick.dy = 0; }
  if (e.pointerId === thrTouch.id) { thrTouch.on = false; thrTouch.id = null; }
  if (e.pointerId === rudTouch.id) { rudTouch.on = false; rudTouch.id = null; rudTouch.dir = 0; }
  if (combat.on && e.pointerId === combat.fireId) { combat.fire = false; combat.fireId = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);

// sécurité : ne jamais laisser une commande bloquée si le doigt disparaît
function releaseAll() {
  stick.on = false; stick.id = null; stick.dx = 0; stick.dy = 0;
  rudTouch.on = false; rudTouch.dir = 0; rudTouch.id = null;
  thrTouch.on = false; thrTouch.id = null;
  if (combat) { combat.fire = false; combat.fireId = null; }
}
addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
function setThrFromY(y, L) {
  throttle = clamp((L.thr.y1 - y) / (L.thr.y1 - L.thr.y0), 0, 1);
  document.getElementById('hint').classList.add('off');
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  initAudio();
  keys.add(e.code);
  if (e.code === 'KeyR') reset();
  if (e.code === 'KeyC') cycleCam();
  if (e.code === 'KeyG') toggleGear();
  if (e.code === 'KeyN') toggleNight();
  if (e.code === 'Space' && combat.on) combat.fire = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Space' && combat.on) combat.fire = false; });
const K = c => keys.has(c) ? 1 : 0;

function keyboard() {
  let e = 0, a = 0, r = 0, t = null;
  if (K('ArrowDown') || K('KeyS')) e -= 1;    // pousser = nez bas
  if (K('ArrowUp')   || K('KeyW')) e += 1;
  if (K('ArrowRight')|| K('KeyD')) a += 1;
  if (K('ArrowLeft') || K('KeyA')) a -= 1;
  if (K('KeyE')) r += 1;
  if (K('KeyQ')) r -= 1;
  if (K('ShiftLeft') || K('ShiftRight')) t = 1;
  if (K('ControlLeft')) t = 0;
  return { e, a, r, t };
}

const _up = new THREE.Vector3(), _right = new THREE.Vector3();
const camLook = new THREE.Vector3(), _camQ = new THREE.Quaternion(), _camE = new THREE.Euler();
const _camOff = new THREE.Vector3(), _camWant = new THREE.Vector3(), _camLookWant = new THREE.Vector3();
var camYaw = null, camInit = false;
function updateCamera(dt) {
  _fwd.set(0, 0, -1).applyQuaternion(rQuat);
  _up.set(0, 1, 0).applyQuaternion(rQuat);
  _right.set(1, 0, 0).applyQuaternion(rQuat);

  if (camMode === 1) {
    // cockpit : rigidement lié à l'avion (pose interpolée => pas de saccades)
    camera.position.copy(rPos).addScaledVector(_fwd, 0.7).addScaledVector(_up, 0.85).addScaledVector(_right, -0.35);
    camera.up.copy(_up);
    camera.lookAt(_camLookWant.copy(rPos).addScaledVector(_fwd, 60).addScaledVector(_up, 0.6));
    aircraft.visible = false;
    camInit = false;
  } else {
    aircraft.visible = true;
    camera.up.set(0, 1, 0);
    // cap lissé (évite les à-coups quand le cap change vite, ex. en looping)
    const yawNow = Math.atan2(-_fwd.x, -_fwd.z);
    if (camYaw === null || !camInit) camYaw = yawNow;
    let dy = yawNow - camYaw;
    dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    if (Math.hypot(_fwd.x, _fwd.z) > 0.15) camYaw += dy * (1 - Math.exp(-dt * 8));
    _camQ.setFromEuler(_camE.set(0, camYaw, 0));
    if (camMode === 0) _camOff.set(0, 4.4, 16); else _camOff.set(7, 2.2, 3);
    _camWant.copy(rPos).add(_camOff.applyQuaternion(_camQ));
    _camLookWant.copy(rPos).addScaledVector(_fwd, 12).addScaledVector(_up, 1.2);
    if (!camInit) { camPos.copy(_camWant); camLook.copy(_camLookWant); camInit = true; }
    // la caméra suit en position relative à l'avion => seul le décalage est lissé, jamais le mouvement de l'avion
    const kP = 1 - Math.exp(-dt * 6), kL = 1 - Math.exp(-dt * 14);
    camPos.lerp(_camWant, kP);
    camLook.lerp(_camLookWant, kL);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
  }
}

const ahCv = el('ah'), ah2d = ahCv.getContext('2d');
const mapCvEl = el('map'), map2d = mapCvEl.getContext('2d');
const MAP_N = 320;
const mapTiles = document.createElement('canvas');
mapTiles.width = mapTiles.height = MAP_N;
let mapReady = false;

function buildMap() {
  const g = mapTiles.getContext('2d');
  const img = g.createImageData(MAP_N, MAP_N);
  const D = mapTiles;
  for (let j = 0; j < MAP_N; j++) {
    for (let i = 0; i < MAP_N; i++) {
      const x = (i / (MAP_N - 1) - 0.5) * T_SIZE;
      const z = (j / (MAP_N - 1) - 0.5) * T_SIZE;
      const h = terrainHeight(x, z);
      let r, gg, b;
      if (h < 0)        { r = 24; gg = 62; b = 96; }
      else if (h < 25)  { r = 156; gg = 172; b = 116; }
      else if (h < 260) { r = 72; gg = 112; b = 64; }
      else if (h < 700) { r = 134; gg = 130; b = 120; }
      else              { r = 232; gg = 238; b = 244; }
      const k = (j * MAP_N + i) * 4;
      img.data[k] = r; img.data[k + 1] = gg; img.data[k + 2] = b; img.data[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  mapReady = true;
}

function drawAH() {
  const S = 150, C = S / 2, R = 60, c = ah2d;
  c.clearRect(0, 0, S, S);
  _fwd.set(0, 0, -1).applyQuaternion(quat);
  _up.set(0, 1, 0).applyQuaternion(quat);
  _right.set(1, 0, 0).applyQuaternion(quat);
  const pitch = Math.asin(clamp(_fwd.y, -1, 1));
  const bank = Math.atan2(-_right.y, _up.y);

  c.save();
  c.beginPath(); c.arc(C, C, R, 0, 6.2832); c.clip();
  c.translate(C, C);
  c.rotate(-bank);
  c.translate(0, clamp(pitch / 0.55, -1.4, 1.4) * R);
  c.fillStyle = '#2f74b0'; c.fillRect(-R * 2, -R * 4, R * 4, R * 4);
  c.fillStyle = '#6b5a3e'; c.fillRect(-R * 2, 0, R * 4, R * 4);
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-R * 2, 0); c.lineTo(R * 2, 0); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.40)'; c.lineWidth = 1.5;
  for (let d = -30; d <= 30; d += 10) {
    if (!d) continue;
    const yy = -(d / 31.5) * R;
    c.beginPath(); c.moveTo(-13, yy); c.lineTo(13, yy); c.stroke();
  }
  c.restore();

  c.strokeStyle = 'rgba(200,225,245,.5)'; c.lineWidth = 2;
  c.beginPath(); c.arc(C, C, R, 0, 6.2832); c.stroke();
  c.strokeStyle = '#ffd24a'; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(C - 24, C); c.lineTo(C - 9, C); c.lineTo(C - 5, C + 7);
  c.moveTo(C + 24, C); c.lineTo(C + 9, C); c.lineTo(C + 5, C + 7);
  c.stroke();
  c.fillStyle = '#ffd24a';
  c.beginPath(); c.arc(C, C, 2.6, 0, 6.2832); c.fill();

let audio = null, muted = false;
function initAudio() {
  if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    const ctx = new Ctx();
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 31;
    const eg = ctx.createGain(); eg.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.7;
    o1.connect(eg); o2.connect(eg); eg.connect(lp); lp.connect(master);
    const len = Math.floor(ctx.sampleRate * 2);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 600; nf.Q.value = 0.7;
    const ng = ctx.createGain(); ng.gain.value = 0;
    noise.connect(nf); nf.connect(ng); ng.connect(master);
    o1.start(); o2.start(); noise.start();
    audio = { ctx, master, o1, o2, eg, lp, ng, nf };
    ctx.resume();
  } catch (e) { audio = null; }
}
function updateAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime, thr = ctrl.thr, v = vel.length();
  const rpm = 0.22 + 0.78 * thr;
  audio.o1.frequency.setTargetAtTime(46 + 78 * rpm, t, 0.08);
  audio.o2.frequency.setTargetAtTime(23 + 39 * rpm, t, 0.08);
  audio.eg.gain.setTargetAtTime(0.05 + 0.13 * thr, t, 0.12);
  audio.lp.frequency.setTargetAtTime(420 + 1900 * thr, t, 0.12);
  audio.ng.gain.setTargetAtTime(0.015 + Math.min(v / 70, 1) * 0.10, t, 0.18);
  audio.nf.frequency.setTargetAtTime(380 + v * 14, t, 0.18);
  audio.master.gain.setTargetAtTime(muted ? 0 : 0.55, t, 0.12);
}

const FIXED = 1 / 120;
let acc = 0, last = performance.now(), fpsT = 0, fpsN = 0, frameN = 0;

function frame(now) {
  const dtReal = Math.min((now - last) / 1000, 0.25);
  last = now;
  fpsT += dtReal; fpsN++;
  if (fpsT > 0.5) { hudFps.textContent = (fpsN / fpsT).toFixed(0); fpsT = 0; fpsN = 0; }

  const kb = keyboard();
  const EXPO = PLANES[planeIdx].perf.expo ?? 0.45;
  const ex = v => v * (1 - EXPO) + EXPO * v * v * v;      // expo : doux au centre (plus marqué sur le chasseur)
  target.elev = clamp(ex(stick.on ? stick.dy : kb.e), -1, 1);
  target.ail  = clamp(ex(stick.on ? stick.dx : kb.a), -1, 1);
  if (kb.t !== null) throttle = lerp(throttle, kb.t, 0.08);
  target.thr = throttle;
  if (throttle > 0.06) hintEl.classList.add('off');
  if (rudTouch.on) target.rud = rudTouch.dir;
  else if (K('KeyQ') || K('KeyE')) target.rud = kb.r;
  else target.rud = 0;

  if (!crashed) {
    acc += Math.min(dtReal, 0.1);
    let guard = 0;
    while (acc >= FIXED && guard++ < 16) {
      prevPos.copy(pos); prevQuat.copy(quat);
      step(FIXED); acc -= FIXED;
    }
    if (acc > FIXED) acc = 0;
  } else {
    acc = 0;
    prevPos.copy(pos); prevQuat.copy(quat);
  }
  // pose affichée = interpolation entre les deux derniers pas physiques
  const alphaI = clamp(acc / FIXED, 0, 1);
  rPos.lerpVectors(prevPos, pos, alphaI);
  rQuat.slerpQuaternions(prevQuat, quat, alphaI);
  aircraft.position.copy(rPos);
  aircraft.quaternion.copy(rQuat);
  if (typeof updateRace === 'function') updateRace(crashed ? 0 : Math.min(dtReal, 0.1));
  updateDecor(Math.min(dtReal, 0.1));
  if (typeof updateCombat === 'function') updateCombat(Math.min(dtReal, 0.1));

  updateCamera(dtReal);
  sky.position.copy(camera.position);
  updateHUD();

  // ombre portée + ombres dynamiques qui suivent l'avion
  {
    const gy = groundAt(rPos.x, rPos.z) + 0.12;
    const agl = clamp(rPos.y - gy, 0, 250);
    shadowMesh.position.set(rPos.x, gy, rPos.z);
    const sc = 13 + agl * 0.09;
    shadowMesh.scale.set(sc, 1, sc * 1.15);
    shadowMesh.material.opacity = 0.22 * clamp(1 - agl / 120, 0.06, 1);
    shadowMesh.rotation.y = Math.atan2(-_fwd.x, -_fwd.z);

    // cadre d'ombre aligné sur la grille des texels : supprime le scintillement des ombres
    const LD = isNight ? MOON_DIR : SUN_DIR;
    _shR.crossVectors(LD, _worldUp).normalize(); _shU.crossVectors(_shR, LD).normalize();
    const texel = (2 * S_SH) / sun.shadow.mapSize.x;
    const a = Math.round(rPos.dot(_shR) / texel) * texel, b = Math.round(rPos.dot(_shU) / texel) * texel;
    const c = rPos.dot(LD);
    _shP.copy(_shR).multiplyScalar(a).addScaledVector(_shU, b).addScaledVector(LD, c);
    sun.target.position.copy(_shP);
    sun.target.updateMatrixWorld();
    sun.position.copy(_shP).addScaledVector(LD, 800);
  }
  waterMat.uniforms.time.value = simT;
  skyMat.uniforms.time.value = simT;
  if (isNight && aircraft.userData.nav) aircraft.userData.nav.beacon.visible = (simT % 1.15) < 0.12;
  updateContrails(dtReal);

  drawControls();
  if (typeof drawCombatOverlay === 'function') drawCombatOverlay();
  drawAH();
  if ((frameN++ & 3) === 0) { drawMap(); updateAudio(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function buildRaceRings(R) {
  const P = R.pts.map(([x, z]) => ({ x, z, y: Math.max(terrainHeight(x, z), 0) + R.agl }));
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1];
      let need = 0;
      for (let k = 1; k < 24; k++) {
        const t = k / 24, x = lerp(a.x, b.x, t), z = lerp(a.z, b.z, t);
        need = Math.max(need, Math.max(terrainHeight(x, z), 0) + R.agl * 0.6 - lerp(a.y, b.y, t));
      }
      if (need > 0) { a.y += need; b.y += need; }
    }
  }
  return P.map((p, i) => {
    const q = P[Math.min(i + 1, P.length - 1)], o = P[Math.max(i - 1, 0)];
    const n = new THREE.Vector3(q.x - o.x, (q.y - o.y) * 0.5, q.z - o.z);
    if (i === 0) n.set(q.x - p.x, 0, q.z - p.z);
    if (i === P.length - 1) n.set(p.x - o.x, 0, p.z - o.z);
    n.normalize();
    return { c: new THREE.Vector3(p.x, p.y, p.z), n };
  });

    f.s.material.opacity = f.op * Math.max(0, 1 - a);
    const sc = f.size + f.grow * f.t; f.s.scale.set(sc, sc, 1);
    f.s.position.y += f.vy * dt;
  }
  combat.fx = combat.fx.filter(f => { if (f.t >= f.life) { combat.group.remove(f.s); f.s.material.dispose(); return false; } return true; });
  // traçantes
  const P = trGeo.attributes.position.array, C = trGeo.attributes.color.array;
  let n = 0;
  for (const u of combat.bullets) {
    if (n >= TR_MAX) break;
    const L = u.enemy ? 0.05 : 0.035;
    P[n * 6] = u.p.x; P[n * 6 + 1] = u.p.y; P[n * 6 + 2] = u.p.z;
    P[n * 6 + 3] = u.p.x - u.v.x * L; P[n * 6 + 4] = u.p.y - u.v.y * L; P[n * 6 + 5] = u.p.z - u.v.z * L;
    const c = u.enemy ? [1, 0.35, 0.25] : [1, 0.9, 0.45];
    C.set(c, n * 6); C.set(c.map(v => v * 0.2), n * 6 + 3);
    n++;
  }
  trGeo.setDrawRange(0, n * 2);
  trGeo.attributes.position.needsUpdate = true; trGeo.attributes.color.needsUpdate = true;
  combat.hitFlash = Math.max(0, combat.hitFlash - dt * 2.5);
  hitEl.style.opacity = combat.hitFlash * 0.55;
}
// marqueurs des cibles, dessinés par-dessus les commandes
const _pv = new THREE.Vector3();
function drawCombatOverlay() {
  if (!combat.on) return;
  const L = layout(), W = L.W, H = L.H, c = ctl2d;
  // bouton FEU
  const F = L.fire, cx = (F.x0 + F.x1) / 2, cy = (F.y0 + F.y1) / 2, R = (F.x1 - F.x0) / 2;
  c.beginPath(); c.arc(cx, cy, R, 0, 6.2832);
  c.fillStyle = combat.fire ? 'rgba(255,80,50,.55)' : 'rgba(170,30,20,.35)'; c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,170,150,.75)'; c.stroke();
  c.fillStyle = '#ffe9e2'; c.font = 'bold 15px ui-monospace,monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('FEU', cx, cy);
  // cibles
  let near = null, nd = 1e9;
  for (const b of combat.bots) {
    if (b.dead) continue;
    const d = b.pos.distanceTo(pos);
    _pv.copy(b.pos).project(camera);
    const sx = (_pv.x * 0.5 + 0.5) * W, sy = (-_pv.y * 0.5 + 0.5) * H;
    if (_pv.z < 1 && sx > 0 && sx < W && sy > 0 && sy < H) {
      const s = clamp(4200 / d, 10, 34);
      c.strokeStyle = 'rgba(255,70,50,.95)'; c.lineWidth = 2;
      for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        c.beginPath(); c.moveTo(sx + dx * s, sy + dy * s * 0.55); c.lineTo(sx + dx * s, sy + dy * s); c.lineTo(sx + dx * s * 0.55, sy + dy * s); c.stroke();
      }
      c.fillStyle = 'rgba(255,200,190,.95)'; c.font = '11px ui-monospace,monospace';
      c.fillText(d > 999 ? (d / 1000).toFixed(1) + ' km' : Math.round(d) + ' m', sx, sy + s + 10);
    } else if (d < nd) { nd = d; near = b; }
  }
  // flèche vers l'ennemi hors écran le plus proche
  if (near) {
    _pv.copy(near.pos).applyMatrix4(camera.matrixWorldInverse);
    const a = Math.atan2(_pv.x, _pv.y);
    const rx = W / 2 + Math.sin(a) * Math.min(W, H) * 0.36, ry = H / 2 - Math.cos(a) * Math.min(W, H) * 0.36;
    c.save(); c.translate(rx, ry); c.rotate(a);
    c.beginPath(); c.moveTo(0, -14); c.lineTo(10, 8); c.lineTo(0, 3); c.lineTo(-10, 8); c.closePath();
    c.fillStyle = 'rgba(255,70,50,.9)'; c.fill(); c.restore();
  }
}
el('bcombat').addEventListener('click', e => {
  e.stopPropagation(); initAudio();
  if (combat.on) { const k = combat.kills; reset(); toast('Combat terminé · ' + k + ' abattu' + (k > 1 ? 's' : '')); }
  else combatStart();
});
window.__combat = () => ({ on: combat.on, wave: combat.wave, kills: combat.kills, hp: combat.hp, bots: combat.bots.length, bullets: combat.bullets.length });
window.__combatStart = () => combatStart();
window.__fire = (v) => { combat.fire = !!v; };

window.__race = () => ({ idx: race.idx, next: race.next, t: race.t, n: race.rings.length, done: race.done, pos: pos.toArray().map(v => Math.round(v)), ring: race.rings[race.next] ? race.rings[race.next].c.toArray().map(v => Math.round(v)) : null });
window.__setState = (s) => {
  if (s.plane != null) setPlane(s.plane);
  if (s.pos) pos.set(s.pos[0], s.pos[1], s.pos[2]);
  if (s.vel) vel.set(s.vel[0], s.vel[1], s.vel[2]);
  if (s.quat) quat.set(s.quat[0], s.quat[1], s.quat[2], s.quat[3]).normalize();
  if (s.omega) omega.set(s.omega[0], s.omega[1], s.omega[2]);
  if (s.onGround != null) onGround = s.onGround;
  if (s.crashed != null) { crashed = s.crashed; if (!crashed) document.getElementById('msg').classList.remove('on'); }
  if (s.throttle != null) { throttle = s.throttle; ctrl.thr = s.throttle; target.thr = s.throttle; }
  if (s.cm0 != null) AC.Cm0 = s.cm0;
  lastGh = groundAt(pos.x, pos.z);
  prevPos.copy(pos); prevQuat.copy(quat); camInit = false;
};
window.__dbg = () => {
  _fwd.set(0, 0, -1).applyQuaternion(quat);
  _up.set(0, 1, 0).applyQuaternion(quat);
  return {
    alt: +pos.y.toFixed(2), vy: +vel.y.toFixed(2), spd: +vel.length().toFixed(1),
    x: +pos.x.toFixed(1), z: +pos.z.toFixed(1),
    aoa: +(aoaLive / D2R).toFixed(1), pitch: +(Math.asin(clamp(_fwd.y, -1, 1)) / D2R).toFixed(1),
    upY: +_up.y.toFixed(3), fwdY: +_fwd.y.toFixed(3),
    thrust: +ctrl.thr.toFixed(2), ground: onGround, crash: crashed, t: +simT.toFixed(1),
    plane: PLANES[planeIdx].name, gearAnim: +gearAnim.toFixed(2), gearDown, night: isNight, planes: PLANES.length
  };
};
window.__toggleGear = toggleGear;
window.__toggleNight = toggleNight;
</script>
